/* ---- What-if: material, process and life volume ------------------------
   The reason to have a cost model at all is to ask what a different material
   or a different process would cost, and how the answer moves with volume.
   Everything here re-runs the same estimator on a throwaway copy of the part,
   so what you see is the model's own answer, not a shortcut. */
function volumeSweep(){
  const v = Math.max(1, num(S.meta.annualVolume, 100));
  const base = [1,10,100,1000,10000,100000];
  if(base.indexOf(v)<0){ base.push(v); base.sort((a,b)=>a-b); }
  return base;
}
/* One unit cost for the same part under a changed material, process or life
   volume. Every chart in the what-if card goes through here, so all of them
   sit on the same basis — a comparison on two different batch sizes is worse
   than no comparison at all.

   Only the costs that amortise — machine setup and tooling — move with volume;
   material and cycle time do not. */
function costOf(pt, opt){
  opt = opt || {};
  const cp = JSON.parse(JSON.stringify(pt));
  cp.id = pt.id;
  if(opt.process) cp.cost.process = opt.process;
  const proc = cp.cost.process;
  if(opt.material && cp.cost[proc]) cp.cost[proc].materialId = opt.material;
  if(opt.volume){
    const v = Math.max(1, opt.volume);
    if(cp.cost.machining) cp.cost.machining.batchSize = v;
    if(cp.cost.foam && cp.cost.foam.method==="moulded")
      cp.cost.foam.toolLife = Math.min(Math.max(1,num(cp.cost.foam.toolLife,1)), v);
    if(cp.cost.composite)
      cp.cost.composite.toolLife = Math.min(Math.max(1,num(cp.cost.composite.toolLife,1)), v);
  }
  return costPart(cp).unit;
}
const PROC_GROUP = {machining:"machining", fdm:"fdm", powder:"powder", foam:"foam",
                    harness:"wire", composite:"composite"};

function whatIfCard(pt){
  const proc = pt.cost.process;
  if(proc==="purchased"){
    return '<fieldset><legend>What-if</legend><p class="note">This part is bought in at a quoted price, so there is '+
      'nothing for the cost model to vary. Change the process to machining, printing or foam to compare materials and volumes.</p></fieldset>';
  }
  const xs = volumeSweep();
  const V = Math.max(1, num(S.meta.annualVolume, 100));
  const at = fmt0(V)+" off";

  /* Cost against life volume — the shape of this curve is the whole tooling
     argument, and it is invisible in a single number at one quantity. */
  const curve = svgLines("Unit cost against life volume", xs,
    [{k:procLabel(proc)+" · "+mat((pt.cost[proc]||{}).materialId).name,
      ys: xs.map(v=>costOf(pt,{volume:v}))}],
    "Life volume (parts)", "Unit cost ("+CUR+")", v=>CUR+fmt0(v));

  const flat = Math.abs(costOf(pt,{volume:1}) - costOf(pt,{volume:100000})) < 0.005;

  /* Same part, every material the process can take. */
  const group = PROC_GROUP[proc];
  const mats = S.lib.materials.filter(m=>m.group===group);
  const matBars = mats.length>1 ? svgBars("Unit cost by material, at "+at,
    mats.map(m=>({k:m.name, v:costOf(pt,{material:m.id, volume:V}),
      c: m.id===(pt.cost[proc]||{}).materialId ? "var(--accent)" : "var(--steel)"})),
    "", v=>CUR+fmt(v)) : "";

  /* Same part, every process that has inputs stored for it. */
  const procs = ["machining","fdm","powder","foam"].filter(p=>p!==proc && pt.cost[p] && num(pt.cost[p].partVolume)>0);
  const procBars = procs.length ? svgBars("Unit cost by process, at "+at,
    [{k:procLabel(proc)+" (current)", v:costOf(pt,{volume:V}), c:"var(--accent)"}]
      .concat(procs.map(p=>({k:procLabel(p), v:costOf(pt,{process:p, volume:V}), c:"var(--steel)"}))),
    "", v=>CUR+fmt(v)) : "";

  return '<fieldset><legend>What-if</legend>'+
    '<p class="note">The same part, re-costed at '+h(at)+'. Nothing here is saved — it is the estimator answering a question.</p>'+
    curve+
    '<p class="note" style="margin-top:8px">'+(flat
      ? "This process carries no setup or tooling to amortise, so the unit cost does not move with volume. That is the finding: volume will not save you here, only a change of material, geometry or process will."
      : "At "+fmt0(xs[0])+" off the part costs "+CUR+fmt(costOf(pt,{volume:xs[0]}))+"; at "+fmt0(xs[xs.length-1])+
        " it costs "+CUR+fmt(costOf(pt,{volume:xs[xs.length-1]}))+". The gap is setup and tooling being spread thinner.")+
      ' The bars below all hold the life volume at '+h(at)+', so the comparison is like for like'+
      (proc==="machining" ? ' — the batch size of '+fmt0(num((pt.cost.machining||{}).batchSize,0))+
        ' stored on the part is overridden for these charts only' : '')+'.</p>'+
    matBars + procBars +
    (procs.length? '' : '<p class="note" style="margin-top:8px">Only one process has geometry entered for this part. '+
      'Fill in the inputs for another process and it will appear here for comparison.</p>')+
  '</fieldset>';
}

function serviceReadout(sv, unitCost){
  if(sv.cls==="none" || sv.cls==="factory") return '<p class="note" style="margin-top:12px">Not treated as a service item, so no repair cost is counted.</p>';
  const rows = [
    ["One service event", sv.eventMin+" min"],
    ["Access (in and out)", r2(sv.depth*S.lib.service.accessPartSec*2/60)+" min over "+sv.depth+" part(s)"],
    ["Soldered joints to break and remake", sv.solder],
    ["Cost per event", CUR+fmt(sv.eventCost)+(sv.destructive? " incl. "+CUR+fmt(unitCost)+" written off":"")],
    ["  of which labour", CUR+fmt(sv.labourCost)],
    ["  of which risk of damaging it", sv.riskCost? CUR+fmt(sv.riskCost)+" ("+sv.riskPct+"% of "+CUR+fmt(unitCost)+")" : "—"],
    ["Over "+sv.removals+" expected removal(s)", CUR+fmt(sv.lifetimeCost)]
  ];
  const trade = sv.solder>0 ? '<tr><td>Connectorise instead</td><td class="n">'+CUR+fmt(sv.connCost)+" + "+r1(sv.connGrams)+
      ' g, saves '+r2(sv.savedSec/60)+' min/removal, pays back after '+sv.breakeven+'</td></tr>' : '';
  return '<div style="margin-top:14px"><div class="tablewrap"><table><tbody>'+
    rows.map(([k,v])=>'<tr><td>'+h(k)+'</td><td class="n">'+h(v)+'</td></tr>').join("")+trade+
    '</tbody></table></div></div>';
}

      fNum(C+".bz","Bounding Z (mm)",{min:0})+ fNum(C+".partVolume","Part volume (mm³)",{min:0})+
    '</div>'+ (moulded ?
      '<div class="grid g4" style="margin-top:10px">'+
        fNum(C+".toolCost","Tool cost ("+CUR+")",{min:0})+
        fNum(C+".toolLife","Tool life (parts)",{min:1,step:1})+
        fNum(C+".cavities","Cavities",{min:1,step:1})+
        fNum(C+".cycleSec","Cycle time (s)",{min:0,hint:"0 = machine default."})+
      '</div>' : '');
  }
  const C = P+".cost.powder";
  return '<div class="grid g3" style="margin-top:12px">'+
    fSel(C+".materialId","Powder", matsOf("powder"))+
    fSel(C+".machineId","Machine", machOf("powder"))+
    fNum(C+".partVolume","Part volume (mm³)",{min:0})+
  '</div><div class="grid g3" style="margin-top:10px">'+
    fNum(C+".bx","Bounding X (mm)",{min:0})+ fNum(C+".by","Bounding Y (mm)",{min:0})+ fNum(C+".bz","Bounding Z (mm)",{min:0})+
  '</div><div class="grid g2" style="margin-top:10px">'+
    fNum(C+".partsPerBuild","Parts per build",{min:0,step:1,hint:"0 = calculate from packing density."})+
    fNum(C+".packingOverride","Packing density override (%)",{min:0,max:60,step:0.5,hint:"0 = use the library default."})+
  '</div>';
}

function holesEditor(pt,C){

function costBreakdown(c){
  const rows = c.lines.filter(l=>Math.abs(l.v)>0.0001).map(l=>
    '<tr><td>'+h(l.k)+'<br><span class="note">'+h(l.d)+'</span></td><td class="n">'+CUR+fmt(l.v)+'</td></tr>').join("");
  const add = [];
  if(c.scrap)    add.push(["Scrap allowance", c.scrap]);
  if(c.overhead) add.push(["Factory overhead", c.overhead]);
  if(c.margin)   add.push(["Supplier margin", c.margin]);
  if(c.freight)  add.push(["Packaging + freight", c.freight]);
  const addRows = add.map(([k,v])=>'<tr><td>'+h(k)+'</td><td class="n">'+CUR+fmt(v)+'</td></tr>').join("");
  const det = c.detail.map(([k,v])=>'<tr><td>'+h(k)+'</td><td class="n">'+h(v)+'</td></tr>').join("");
  return '<div style="margin-top:16px"><div class="tablewrap"><table><thead><tr><th>Cost element</th><th class="n">Amount</th></tr></thead><tbody>'+
    rows+addRows+
    '<tr><td><b style="color:var(--ink)">Unit cost ('+(c.basis==="vendor"?"vendor should-cost":"in-house")+')</b></td><td class="n"><b style="color:var(--ink)">'+CUR+fmt(c.unit)+'</b></td></tr>'+
    '</tbody></table></div>'+
    '<details class="calc"><summary>Show the working</summary><div class="tablewrap"><table><tbody>'+det+'</tbody></table></div></details></div>';
}

/* ---- Analysis ---- */
function viewAnalysis(){
  const c = costProduct(), d = c.dfa;
  const f = findings();

  const partRows = c.rows.map(({pt,c:cc})=>{
    const r = dfaPart(pt);
    return '<tr><td>'+(r.isOp?'<i>'+h(pt.name)+'</i>':'<b>'+h(pt.name)+'</b>')+'</td>'+
      '<td>'+(r.isOp?'<span class="chip neutral">op</span>'
                    :r.essential?'<span class="chip ok">A</span>':'<span class="chip risk">B</span>')+'</td>'+
      '<td class="n">'+r.qty+'</td>'+
      '<td class="n'+(r.overHandling?' over':'')+'">'+(r.isOp?'—':r.handlingIndex)+'</td>'+
      '<td class="n'+(r.overFitting?' over':'')+'">'+(r.isOp?'—':r.fittingIndex)+'</td>'+
      '<td class="n">'+r.totalSec+'</td>'+
      '<td>'+h(r.isOp?"Assembly operation":procLabel(pt.cost.process))+'</td>'+
      '<td class="n">'+CUR+fmt(cc.unit)+'</td>'+
      '<td class="n">'+CUR+fmt(cc.extended)+'</td>'+
      '<td class="n"'+(cc.massSource==="unknown"?' style="color:var(--steel)"':'')+'>'+
        (cc.massExtended? r1(cc.massExtended) : "—")+'</td>'+
      '<td class="n">'+(c.partsTotal? r1(cc.extended/c.partsTotal*100):0)+'%</td></tr>';
  }).join("");

  const findRows = f.length ? f.map(x=>
    '<li><span class="chip '+(x.sev==="risk"?"risk":x.sev==="warn"?"warn":"neutral")+'">'+
      (x.sev==="risk"?"act":x.sev==="warn"?"review":"note")+'</span>'+
      '<div><b>'+h(x.part)+' — '+h(x.title)+'</b><br>'+h(x.why)+'<br><span class="note">'+h(x.gain)+'</span></div></li>').join("")
    : '<li><span class="chip ok">clear</span><div>No parts breach the targets. Tighten the targets in the Library tab if this looks too easy.</div></li>';

  return '<div class="card"><p class="eyebrow">'+h(S.meta.name)+' · rev '+h(S.meta.rev)+'</p><h2>Results</h2>'+
      '<p class="sub">Everything below recomputes from the part records — nothing is cached.</p>'+
      kpiRow(d,c)+'</div>'+

    '<div class="card"><h2>Part-by-part</h2><p class="sub">Class A parts pass at least one minimum-part-count test. Red indices breach the targets.</p>'+
      '<div class="tablewrap"><table><thead><tr><th>Part</th><th>Class</th><th class="n">Qty</th>'+
      '<th class="n">Handling</th><th class="n">Fitting</th><th class="n">Assy s</th><th>Process</th>'+
      '<th class="n">Unit</th><th class="n">Extended</th><th class="n">Mass g</th><th class="n">Share</th></tr></thead><tbody>'+
      (partRows||'<tr><td colspan="11" class="note">No parts yet.</td></tr>')+'</tbody></table></div></div>'+
      moduleCard(c)+ domainCard(c)+ serviceCard(c)+ fieldCard(c)+

    '<div class="card"><h2>Where the money and the minutes are</h2>'+
      '<div class="tablewrap"><table><thead><tr><th>Element</th><th class="n">Cost</th><th class="n">Share</th></tr></thead><tbody>'+
        '<tr><td>Parts (all processes)</td><td class="n">'+CUR+fmt(c.partsTotal)+'</td><td class="n">'+(c.total?r1(c.partsTotal/c.total*100):0)+'%</td></tr>'+
        '<tr><td>Assembly labour ('+d.totalSec+' s @ '+CUR+num(S.lib.rates.assemblyLabourPerHour)+'/hr)</td><td class="n">'+CUR+fmt(c.assemblyLabour)+'</td><td class="n">'+(c.total?r1(c.assemblyLabour/c.total*100):0)+'%</td></tr>'+
        '<tr><td><b style="color:var(--ink)">Total product cost</b></td><td class="n"><b style="color:var(--ink)">'+CUR+fmt(c.total)+'</b></td><td class="n">100%</td></tr>'+
        '<tr><td>Annual, at '+fmt0(S.meta.annualVolume)+' units</td><td class="n">'+CUR+fmt0(c.total*num(S.meta.annualVolume))+'</td><td class="n"></td></tr>'+
        (c.massG? '<tr><td>Mass roll-up'+(c.unknownMass? ' — '+c.unknownMass+' part(s) not yet weighed':'')+'</td><td class="n">'+r1(c.massG)+' g</td>'+
          '<td class="n">'+(num(S.meta.massTargetG)>0? r1(c.massG/num(S.meta.massTargetG)*100)+'% of budget':'')+'</td></tr>'+
          '<tr><td>Cost per gram</td><td class="n">'+CUR+fmt(c.total/c.massG)+'/g</td><td class="n"></td></tr>' : '')+
      '</tbody></table></div></div>'+

    '<div class="card"><h2>What to change</h2><p class="sub">Ranked by impact. Consolidation first — a part removed costs nothing to make, handle, fit or stock.</p>'+
      '<ul class="flags">'+findRows+'</ul></div>'+

    '<div class="card noprint"><h2>Report</h2><p class="sub">Print to PDF for the design review, or export the raw numbers.</p>'+
      '<div class="rowact"><button class="btn primary" onclick="window.print()">Print / save as PDF</button>'+
      '<button class="btn" id="btnCsvOut">Export results as CSV</button></div></div>';
}
function moduleCard(c){
  if(c.modules.length<2) return "";
  const rows = c.modules.map(g=>
    '<tr><td><b>'+h(g.name)+'</b></td>'+
    '<td class="n">'+g.parts+(g.ops? ' <span class="note">+'+g.ops+' op</span>':'')+'</td>'+
    '<td class="n'+(g.parts && g.designEff<S.lib.dfa.targets.designEff?' over':'')+'">'+(g.parts? g.designEff+'%':'—')+'</td>'+
    '<td class="n">'+r1(g.massG)+'</td>'+
    '<td class="n">'+(c.massG? r1(g.massG/c.massG*100):0)+'%</td>'+
    '<td class="n">'+r2(g.sec)+'</td>'+
    '<td class="n">'+CUR+fmt(g.cost)+'</td>'+
    '<td class="n">'+(c.partsTotal? r1(g.cost/c.partsTotal*100):0)+'%</td></tr>').join("");
  return '<div class="card"><h2>By module</h2>'+
    '<p class="sub">Sorted by cost. A module below the design-efficiency target is where a consolidation review pays best.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Module</th><th class="n">Parts</th><th class="n">Design eff.</th>'+
    '<th class="n">Mass g</th><th class="n">Mass %</th><th class="n">Assy s</th><th class="n">Cost</th><th class="n">Cost %</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function domainCard(c){

  const rows = c.domains.map(g=>
    '<tr><td><b>'+h(g.name)+'</b></td>'+
    '<td class="n">'+g.parts+(g.ops? ' <span class="note">+'+g.ops+' op</span>':'')+'</td>'+
    '<td class="n'+(g.parts && g.designEff<S.lib.dfa.targets.designEff?' over':'')+'">'+(g.parts? g.designEff+'%':'—')+'</td>'+
    '<td class="n">'+r1(g.massG)+'</td><td class="n">'+r2(g.sec)+'</td>'+
    '<td class="n">'+CUR+fmt(g.cost)+'</td>'+
    '<td class="n'+(g.solder?' over':'')+'">'+(g.solder||"—")+'</td>'+
    '<td class="n">'+(g.svcCost? CUR+fmt(g.svcCost):"—")+'</td></tr>').join("");
  return '<div class="card"><h2>By domain</h2>'+
    '<p class="sub">Mechanical, electrical, wiring, and the electromechanical interface between them — where brackets meet boards '+
    'and most integration problems live.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Domain</th><th class="n">Parts</th><th class="n">Design eff.</th>'+
    '<th class="n">Mass g</th><th class="n">Assy s</th><th class="n">Cost</th><th class="n">Solder joints</th>'+
    '<th class="n">Lifetime service</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function serviceCard(c){
  const items = c.rows.filter(x=>x.c.service.serviceable);
  if(!items.length) return "";
  const K = S.lib.service;
  const rows = items.sort((a,b)=>b.c.service.eventSec-a.c.service.eventSec).map(({pt,c:cc})=>{
    const sv = cc.service;
    return '<tr><td><b>'+h(pt.name)+'</b><br><span class="note">'+h(pt.module||"")+'</span></td>'+
      '<td>'+(sv.cls==="field"?'<span class="chip acc">field</span>':'<span class="chip neutral">depot</span>')+'</td>'+
      '<td>'+(sv.solder? '<span class="chip risk">'+sv.solder+' soldered</span>'
             : sv.destructive? '<span class="chip risk">destructive</span>'
             : '<span class="chip ok">separable</span>')+'</td>'+
      '<td class="n">'+sv.depth+'</td><td class="n">'+sv.eventMin+'</td>'+
      '<td class="n">'+CUR+fmt(sv.eventCost)+'</td><td class="n">'+sv.removals+'</td>'+
      '<td class="n">'+CUR+fmt(sv.lifetimeCost)+'</td>'+
      '<td class="n">'+(sv.solder? CUR+fmt(sv.connCost)+" / "+sv.breakeven : "—")+'</td></tr>';
  }).join("");
  const totLife = items.reduce((a,x)=>a+x.c.service.lifetimeCost,0);
  return '<div class="card"><h2>Serviceability</h2>'+
    '<p class="sub">Every item expected to come out again. A soldered wire-to-board joint costs nothing to make and nothing in grams, '+
    'so build cost never sees it — the whole bill arrives at the first repair. The last column is what a connector would cost '+
    'and how many removals it takes to pay for itself.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Part</th><th>Class</th><th>Joint</th><th class="n">Depth</th>'+
    '<th class="n">Event min</th><th class="n">Event cost</th><th class="n">Removals</th><th class="n">Lifetime</th>'+
    '<th class="n">Connectorise / payback</th></tr></thead><tbody>'+rows+
    '<tr><td colspan="7"><b style="color:var(--ink)">Lifetime service cost</b></td>'+
    '<td class="n"><b style="color:var(--ink)">'+CUR+fmt(totLife)+'</b></td><td></td></tr>'+
    '</tbody></table></div>'+
    '<p class="note" style="margin-top:10px">Assumes '+K.desolderSecPerJoint+' s to break and remake one soldered joint, '+
    K.diagnosisMin+' min fault-finding, '+K.testAfterMin+' min retest, and a '+K.solderDamageRiskPct+
    '% chance per event of damaging the board — all editable in Library → Cost model.<br><br>'+
    '<b>Read the payback column carefully.</b> It counts maintenance labour and the risk of writing off the assembly, '+
    'and at Indian labour rates a connector rarely pays back on labour alone. The arguments it does <i>not</i> price are usually '+
    'the deciding ones: turnaround time, whether the repair can happen at the flight line instead of a bench, aircraft '+
    'availability, and the fact that a soldered joint means a technician with an iron near a live airframe.</p></div>';
}

function fieldCard(c){
  const d = c.dfa;
  if(!d.fieldParts) return "";
  const target = num(S.meta.fieldDeployTargetSec);
  const rows = c.rows.filter(x=>x.pt.fieldAssembly).map(({pt})=>{
    const r = dfaPart(pt);
    return '<tr><td><b>'+h(pt.name)+'</b></td>'+
      '<td>'+(pt.toolFree?'<span class="chip ok">tool-free</span>':'<span class="chip risk">needs a tool</span>')+'</td>'+
      '<td>'+h((S.lib.dfa.fFix[pt.dfa.fix]||{label:pt.dfa.fix}).label)+'</td>'+
      '<td class="n">'+r.qty+'</td><td class="n">'+r.totalSec+'</td>'+
      '<td class="n">'+(d.fieldSec? r1(r.totalSec/d.fieldSec*100):0)+'%</td></tr>';
  }).join("");
  return '<div class="card"><h2>Field deployment</h2>'+
    '<p class="sub">Only the joints the operator makes on site, estimated from the same handling and fitting answers as the factory build. '+
    'Tool-free assembly is a product promise — the parts marked otherwise are the ones that break it.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Part</th><th>Tooling</th><th>Fixing</th>'+
    '<th class="n">Qty</th><th class="n">Seconds</th><th class="n">Share</th></tr></thead><tbody>'+rows+
    '<tr><td colspan="4"><b style="color:var(--ink)">Total deployment</b></td>'+
    '<td class="n"><b style="color:var(--ink)">'+d.fieldSec+'</b></td>'+
    '<td class="n">'+(target? (d.fieldSec<=target?'<span class="chip ok">within '+target+' s</span>':'<span class="chip risk">over '+target+' s</span>') : '')+'</td></tr>'+
    '</tbody></table></div></div>';
}

function procLabel(p){ return {machining:"CNC", fdm:"FDM", powder:"SLS/MJF", composite:"Composite",
  foam:"Foam", harness:"Harness", purchased:"Purchased"}[p]||p; }

/* ---- Library ---- */
/* ---- Reports ----------------------------------------------------------
   The six outputs a DFMA study is expected to produce: an executive summary
   of the assembly analysis, one of the whole thing including cost, a product
   worksheet listing every item with its answers, the structure chart, the
   analysis totals, and the redesign suggestions. Print to PDF gives you the
   report pack. */
const REPORTS = [
  ["execDfa","Executive summary — DFA"],
  ["execDfma","Executive summary — DFMA"],
  ["worksheet","Product worksheet"],
  ["structure","Structure chart"],
  ["totals","Analysis totals"],
  ["redesign","Suggestions for redesign"]
];

function viewReports(){
  const which = ui.report || "execDfa";
  const nav = '<div class="rowact noprint" style="margin-bottom:16px">'+
    REPORTS.map(([k,l])=>'<button class="btn sm'+(k===which?" primary":"")+'" data-report="'+k+'">'+h(l)+'</button>').join("")+
    '</div>';
  const head = '<div class="card"><p class="eyebrow">'+h(S.meta.name||"Untitled")+' · rev '+h(S.meta.rev||"—")+
    ' · '+h(variant().name)+'</p><h2>'+h((REPORTS.find(r=>r[0]===which)||[,""])[1])+'</h2>'+
    '<p class="sub">'+h(S.meta.analyst? S.meta.analyst+" · " : "")+h(S.meta.date||"")+'</p>'+ nav +
    '<div class="rowact noprint"><button class="btn primary" onclick="window.print()">Print / save as PDF</button>'+
    '<button class="btn" id="btnCsvOut2r">Export results as CSV</button></div></div>';

  const body =
      which==="execDfa"   ? repExecDfa()
    : which==="execDfma"  ? repExecDfma()
    : which==="worksheet" ? repWorksheet()
    : which==="structure" ? repStructure()
    : which==="totals"    ? repTotals()
    :                       repRedesign();
  return head + body;
}

function repExecDfa(){
  const c = costProduct(), d = c.dfa;
  const T = S.lib.dfa.targets;
  const cands = c.rows.filter(({pt})=>!dfaPart(pt).isOp && !dfaPart(pt).essential);
  const candSec = cands.reduce((a,{pt})=>a+dfaPart(pt).totalSec,0);
  const candCost = cands.reduce((a,x)=>a+x.c.extended,0);
  const candMass = cands.reduce((a,x)=>a+x.c.massExtended,0);

  return '<div class="card rep">'+
    kpiRow(d,c)+
    '<h3>What the analysis says</h3>'+
    '<p class="note">The product is built from <b>'+d.nTotal+' parts</b>'+
      (d.nSub? ' across '+d.nSub+' sub-assembl'+(d.nSub===1?"y":"ies") : '')+
      (d.nOps? ' plus '+d.nOps+' assembly operation'+(d.nOps===1?"":"s") : '')+
      '. Of those, <b>'+d.nEss+'</b> pass at least one minimum-part-count test and must stay separate. '+
      'The remaining <b>'+d.nRedundant+'</b> are candidates for elimination or consolidation, giving a design '+
      'efficiency of <b>'+d.designEff+'%</b> against a target of '+T.designEff+'%.</p>'+
    '<p class="note">Assembly takes <b>'+r2(d.totalMin)+' minutes</b> per product'+
      (d.opSec? ', of which '+r2(d.opSec/60)+' min is assembly operations rather than fitting parts' : '')+
      ', costing '+CUR+fmt(c.assemblyLabour)+' in labour at '+CUR+num(S.lib.rates.assemblyLabourPerHour)+'/hr. '+
      'Against an ideal of '+num(S.lib.rates.idealAssemblySec)+' s per essential part, that is an assembly efficiency '+
      'of <b>'+d.efficiency+'%</b>.</p>'+
    '<h3>The prize</h3>'+
    '<p class="note">'+(cands.length===0
      ? "Every part passes a minimum-part-count test, so there is nothing left to consolidate. Either the design is already tight, or the tests were answered generously — a 100% design efficiency is worth a second look before it goes in front of a reviewer."
      : "Eliminating every part that fails all three tests would remove <b>"+cands.length+
        "</b> part record"+(cands.length===1?"":"s")+" worth "+CUR+fmt(candCost)+", "+r1(candMass)+" g and "+
        r2(candSec/60)+" min of assembly. In practice you will not get all of it — but it is the size of the argument.")+'</p>'+
    svgBars("Assembly time by module", c.modules.map(m=>({k:m.name, v:m.sec})), " s", v=>fmt0(v))+
    svgBars("Design efficiency by module", c.modules.map(m=>({k:m.name, v:m.designEff})), "%", v=>r1(v))+
  '</div>';
}

function repExecDfma(){
  const c = costProduct(), d = c.dfa;
  const rows = [
    ["Parts in the product", d.nTotal],
    ["Theoretical minimum part count", d.nEss],
    ["Consolidation candidates", d.nRedundant],
    ["Sub-assemblies", d.nSub],
    ["Assembly operations", d.nOps],
    ["Design efficiency", d.designEff+" %"],
    ["Assembly efficiency", d.efficiency+" %"],
    ["Total assembly time", r2(d.totalMin)+" min"],
    ["Assembly labour cost", CUR+fmt(c.assemblyLabour)],
    ["Parts cost", CUR+fmt(c.partsTotal)],
    ["Total product cost", CUR+fmt(c.total)],
    ["Product mass", r1(c.massG)+" g"+(num(S.meta.massTargetG)>0? " of a "+fmt0(S.meta.massTargetG)+" g budget":"")],
    ["Cost per gram", c.massG? CUR+fmt(c.total/c.massG)+"/g" : "—"],
    ["Annual spend at "+fmt0(S.meta.annualVolume)+" units", CUR+fmt0(c.total*num(S.meta.annualVolume))],
    ["Lifetime service cost", CUR+fmt0(c.svc.lifetimeCost)]
  ];
  const procMap = new Map();
  c.rows.forEach(({pt,c:cc})=>{
    const k = pt.itemType==="operation" ? "Assembly operations" : procLabel(pt.cost.process);
    procMap.set(k, (procMap.get(k)||0) + cc.extended);
  });
  const procRows = Array.from(procMap.entries()).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k, v}));

  return '<div class="card rep">'+
    '<div class="tablewrap"><table><tbody>'+
      rows.map(([k,v])=>'<tr><td>'+h(k)+'</td><td class="n mono">'+h(String(v))+'</td></tr>').join("")+
    '</tbody></table></div>'+
    svgBars("Cost by process", procRows, "", v=>CUR+fmt0(v))+
    svgBars("Cost by module", c.modules.map(m=>({k:m.name, v:m.cost})), "", v=>CUR+fmt0(v))+

function repRedesign(){
  const f = findings();
  const byPart = new Map();
  f.forEach(x=>{ if(!byPart.has(x.part)) byPart.set(x.part,[]); byPart.get(x.part).push(x); });
  const blocks = Array.from(byPart.entries()).map(([part, items])=>
    '<h3>'+h(part)+'</h3>'+
    '<ul class="flags">'+items.map(x=>
      '<li><span class="chip '+(x.sev==="risk"?"risk":x.sev==="warn"?"warn":"neutral")+'">'+
      (x.sev==="risk"?"act":x.sev==="warn"?"review":"note")+'</span>'+
      '<div><b>'+h(x.title)+'</b><br>'+h(x.why)+'<br><span class="note">'+h(x.gain)+'</span></div></li>').join("")+
    '</ul>').join("");

  return '<div class="card rep">'+
    '<p class="sub">Grouped by item, ranked within each. '+f.length+' finding'+(f.length===1?"":"s")+'.</p>'+
    (blocks || '<div class="empty">Nothing breaches the targets. Tighten them in the Library tab if that looks too easy.</div>')+
    '<h3>How to use this</h3>'+
    '<p class="note">Work consolidation first: a part that is not there costs nothing to make, handle, fit, stock or '+
    'inspect, and it cannot fail. Then the joining method — screws are the most expensive way to hold two things '+
    'together and the easiest to design out. Process and material changes come last: they move the unit cost, but they '+
    'rarely move the assembly time, and assembly time is what a DFA study is for.</p>'+
    '<p class="note">Take each accepted change into a cloned option on the Options tab, so the improvement is measured '+
    'rather than asserted.</p>'+
  '</div>';
}

/* ---- Design options ---------------------------------------------------
   A DFMA study is a comparison. You hold the original, then propose options —
   conventionally one for materials, one for processes, one for the assembly
   itself — and justify the improvement in each. This is that view. */
function viewOptions(){
  const sums = S.variants.map(variantSummary);
  const baseSum = sums[0];

  const cards = S.variants.map((v,i)=>{
    const s = sums[i], isActive = v.id===S.active;
    const d = (cur, ref, inv)=>{
      if(i===0 || !ref) return '<span class="delta flat">baseline</span>';
      const pct = ref? (cur-ref)/ref*100 : 0;
      const better = inv ? pct>0 : pct<0;
      const cls = Math.abs(pct)<0.05 ? "flat" : better ? "down" : "up";
      return '<span class="delta '+cls+'">'+(pct>0?"+":"")+r1(pct)+'%</span>';
    };
    return '<div class="optcard'+(isActive?" active":"")+'">'+
      '<div class="ob">'+
        '<h3>'+h(v.name)+(isActive?' <span class="chip acc">editing</span>':'')+'</h3>'+
        (v.note? '<p class="note" style="margin:0 0 8px">'+h(v.note)+'</p>':'')+
        '<div class="livebar" style="margin:0">'+
          '<div><b>Parts</b>'+s.parts+' ('+s.ess+' essential)</div>'+
          '<div><b>Design eff.</b>'+s.designEff+'% '+d(s.designEff, baseSum.designEff, true)+'</div>'+
          '<div><b>Assembly</b>'+r2(s.sec/60)+' min '+d(s.sec, baseSum.sec)+'</div>'+
          '<div><b>Mass</b>'+r1(s.massG)+' g '+d(s.massG, baseSum.massG)+'</div>'+
          '<div><b>Cost</b>'+CUR+fmt0(s.total)+' '+d(s.total, baseSum.total)+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="rowact" style="flex-direction:column;flex:none">'+
        (isActive? '<span class="chip ok">active</span>'
                 : '<button class="btn sm primary" data-usevar="'+v.id+'">Edit this</button>')+
        '<button class="btn sm" data-clonevar="'+v.id+'">Clone</button>'+
        (i===0? '' : '<button class="btn sm danger" data-delvar="'+v.id+'">Delete</button>')+
      '</div>'+
    '</div>';
  }).join("");

  const cmp = sums.length>1 ? compareCard(sums) :
    '<div class="card"><h2>Nothing to compare yet</h2>'+
    '<p class="sub">One option is a costing. Two or more is a design study.</p>'+
    '<p class="note">Clone the original, change something substantial — a material, a process, a joint that removes four '+
    'screws — and this page will show you what it bought you. The three that earn their keep, in order: consolidate parts, '+
    'change the joining method, change the process. Materials usually move mass more than cost.</p></div>';

  return '<div class="card"><p class="eyebrow">'+h(S.meta.name)+'</p><h2>Design options</h2>'+
      '<p class="sub">Each option is a complete part list, analysed by the same engine. Percentages are against the first option.</p>'+
      cards+
      '<div class="rowact" style="margin-top:12px">'+
        '<button class="btn primary" id="btnNewVariant">Clone the active option</button>'+
        '<button class="btn" id="btnStdOptions">Add the three standard options</button>'+
      '</div>'+
      '<p class="note" style="margin-top:10px">Everything you edit on the Parts tab belongs to the option marked '+
      '<b>editing</b>. Switch before you start changing things.</p>'+
    '</div>'+ cmp;
}

function compareCard(sums){
  const base = sums[0];
  const pct = (cur,ref)=> ref? r1((cur-ref)/ref*100) : 0;
  const cell = (cur, ref, i, unit, inv)=>{
    if(i===0) return '<td class="n">'+unit(cur)+'</td>';
    const p = pct(cur,ref), better = inv? p>0 : p<0;
    const cls = Math.abs(p)<0.05?"flat":better?"down":"up";
    return '<td class="n">'+unit(cur)+'<br><span class="delta '+cls+'" style="font-size:11px">'+(p>0?"+":"")+p+'%</span></td>';
  };
  const money = v=>CUR+fmt0(v), grams = v=>r1(v)+" g", mins = v=>r2(v/60)+" min",
        pctU = v=>r1(v)+"%", plain = v=>fmt0(v);

  const metrics = [
    ["Parts in the product", s=>s.parts, plain, false],
    ["Theoretical minimum", s=>s.ess, plain, false],
    ["Design efficiency", s=>s.designEff, pctU, true],
    ["Assembly efficiency", s=>s.eff, pctU, true],
    ["Assembly time", s=>s.sec, mins, false],
    ["Assembly operations", s=>s.ops, plain, false],
    ["Mass", s=>s.massG, grams, false],
    ["Parts cost", s=>s.partsCost, money, false],
    ["Assembly labour", s=>s.labour, money, false],
    ["Product cost", s=>s.total, money, false],
    ["Lifetime service cost", s=>s.service, money, false]
  ];

  const rows = metrics.map(([label, get, unit, inv])=>
    '<tr><td>'+h(label)+'</td>'+
    sums.map((s,i)=>cell(get(s), get(base), i, unit, inv)).join("")+'</tr>').join("");

  /* One colour for the options and a duller one for the baseline. Colour here
     would only imply a meaning it does not have — the label says which option
     each bar is, and the length says the rest. */
  const bar = get => sums.map((s,i)=>({k:s.name, v:get(s), c: i===0 ? "var(--steel)" : "var(--accent)"}));
  const charts =
    svgBars("Assembly time", bar(s=>s.sec), " s", v=>fmt0(v))+
    svgBars("Product cost", bar(s=>s.total), "", v=>CUR+fmt0(v))+
    svgBars("Mass", bar(s=>s.massG), " g", v=>r1(v))+
    svgBars("Design efficiency", bar(s=>s.designEff), "%", v=>r1(v));

  const best = sums.slice().sort((a,b)=>a.total-b.total)[0];
  const quickest = sums.slice().sort((a,b)=>a.sec-b.sec)[0];
  const lightest = sums.slice().sort((a,b)=>a.massG-b.massG)[0];

  return '<div class="card"><h2>Side by side</h2>'+
    '<p class="sub">Green is an improvement on the first option, red is worse.</p>'+
    '<div class="tablewrap"><table><thead><tr><th>Metric</th>'+
      sums.map(s=>'<th class="n">'+h(s.name)+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    charts+
    '<p class="note" style="margin-top:14px">Cheapest to build: <b>'+h(best.name)+'</b> at '+CUR+fmt0(best.total)+
    '. Quickest to assemble: <b>'+h(quickest.name)+'</b> at '+r2(quickest.sec/60)+' min. Lightest: <b>'+h(lightest.name)+
    '</b> at '+r1(lightest.massG)+' g. Those are rarely the same option, which is the argument the review is actually for.</p>'+
  '</div>';
}

function parseCsv(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=ch;
    } else if(ch==='"') q=true;
    else if(ch===","){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=="\r") cell+=ch;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function yes(v){ const s=String(v||"").trim().toLowerCase(); return s==="1"||s==="y"||s==="yes"||s==="true"; }

const CSV_FITTING_FLAGS  = ["notSelfLocating","holdDown","resistance","obstructed","restrictedVision",
                            "reorient","adjust","testStep","connectorMate","routing","torqueSpec",
                            "threadlock","esd","calibrate","traceability"];

function importCsv(text){
  const rows = parseCsv(text);
  if(!rows.length || !rows[0].length || !rows[0].join("").trim()){
    alert("There is nothing to read in that \u2014 no rows at all."); return;
  }
  const head = rows[0].map(x=>x.trim().toLowerCase());
  const col = n=>head.indexOf(String(n).toLowerCase());

  /* A file whose first line is not a header row — the wrong sheet, a title
     row above the headers, a spreadsheet run through a converter — would
     otherwise import as a pile of identically-named parts on pure defaults.
     Recognising nothing is the signal; say so and change nothing. */
  const KNOWN = ["name","partno","qty","module","domain","itemtype","parent","isbase","moves",
                 "material_diff","service","bcat","reason","size","sym","dir","fix","fixcount",
                 "massg","process","price","material","volume","bx","by","bz","opsec","wireid"];
  const matched = KNOWN.filter(k=>head.indexOf(k)>=0);
  if(!matched.length){
    alert("That does not look like a parts file.\n\nThe first line has to be the column names. "+
          "None were recognised — the first line read:\n\n"+
          rows[0].slice(0,6).map(x=>"  "+(x||"(blank)")).join("\n")+
          (rows[0].length>6 ? "\n  … and "+(rows[0].length-6)+" more" : "")+
          "\n\nNothing was imported. If this came from the input workbook, export the Parts sheet "+
          "with the column names on the first line.");
    return;
  }
  if(rows.length < 2){
    alert("The column names are there, but there are no part rows beneath them.\n\n"+
          "Recognised on the first line: "+matched.join(", ")+"\n\nNothing was imported.");
    return;
  }
  const warn = [];
  if(head.indexOf("name")<0) warn.push("No \u201Cname\u201D column \u2014 every row will be called \u201CImported part\u201D.");
  /* A BOM import ADDS rows; it does not replace them. Building one part list
     from several files needs that. Importing the same file twice does not —
     and the doubled result still looks plausible, which is how a sample
     project plus six imports becomes a 145-part analysis nobody meant to run.

     So only interrupt when the file looks like one already imported: judge it
     by how many of its names are already here, not by whether anything is. */
  /* Replacing is what people mean by "import my BOM", so that is the default
     and the only thing a prompt ever offers. Building one part list from
     several files is real but rarer, so it is an explicit checkbox next to the
     import controls rather than a choice buried in a modal.

     Cancel always means nothing happens. An earlier version put "add them
     anyway" on Cancel, which turned a cancelled import into another stacked
     copy — the exact failure it was meant to prevent. */
  const hadRows = S.parts.length;
  const adding = S.settings.importMode === "add";

  if(hadRows > 0 && !adding){
    const incoming = rows.slice(1).filter(r=>r && r.join("").trim()).length;
    const what = S.meta.sample
      ? "\u201C"+(variant().name||"This option")+"\u201D still holds the built-in sample project \u2014 "+
        hadRows+" items nobody chose."
      : "\u201C"+(variant().name||"This option")+"\u201D already holds "+hadRows+" item"+(hadRows===1?"":"s")+".";
    const ok = confirm(
      what+"\n\nReplace "+(hadRows===1?"it":"them")+" with the "+incoming+" in this file?\n\n"+
      "OK \u2014 replace, and analyse only this file.\n"+
      "Cancel \u2014 do nothing.\n\n"+
      "To keep both instead, tick \u201CAdd to the parts already here\u201D on the Data tab first.");
    if(!ok){ toast("Import cancelled \u2014 nothing changed"); return; }
    setParts([]);
  }
  S.meta.sample = false;

  let added=0;

  rows.slice(1).forEach((r,ri)=>{
    const g = n => { const i=col(n); return i>=0 ? String(r[i]==null?"":r[i]).trim() : ""; };
    const has = n => col(n)>=0 && String(r[col(n)]==null?"":r[col(n)]).trim()!=="";
    const nOf = (n,d) => has(n) ? num(g(n),d) : d;
    const rowRef = "row "+(ri+2);
    const pt = samplePart();

    /* ---- identity ---- */
    pt.name = g("name") || "Imported part";
    pt.partNo = g("partno");
    if(has("qty")) pt.qty = nOf("qty",1);
    if(has("module")) pt.module = g("module");
    if(has("massg")) pt.massG = nOf("massg",0);
    if(has("fieldassembly")) pt.fieldAssembly = yes(g("fieldassembly"));
    if(has("toolfree")) pt.toolFree = yes(g("toolfree"));
    if(has("domain")){
      const dm = g("domain").toLowerCase();
      if(DOMAINS[dm]) pt.domain = dm; else warn.push(rowRef+": domain “"+dm+"” not recognised");
    }
    if(has("serviceclass")){
      const sc = g("serviceclass").toLowerCase();
      if(["none","field","depot","factory"].indexOf(sc)>=0) pt.service.cls = sc;
      else warn.push(rowRef+": serviceClass “"+sc+"” not recognised");
    }
    if(has("removalsperlife"))    pt.service.removalsPerLife = nOf("removalsperlife",0);
    if(has("accessdepth"))        pt.service.accessDepth     = nOf("accessdepth",0);
    if(has("solderjoints"))       pt.service.solderJoints    = nOf("solderjoints",0);
    if(has("reworkmin"))          pt.service.reworkMin       = nOf("reworkmin",0);
    if(has("damageriskpct"))      pt.service.damageRiskPct   = nOf("damageriskpct",0);
    if(has("destructiveremoval")) pt.service.destructive     = yes(g("destructiveremoval"));

    /* ---- structure ---- */
    if(has("itemtype")){
      const it = g("itemtype").toLowerCase();
      if(ITEM_TYPES[it]) pt.itemType = it;
      else warn.push(rowRef+": itemType “"+g("itemtype")+"” not recognised");
    }
    /* The parent is named, not identified — a spreadsheet has no ids. Resolved
       against the names below, once every row has been read. */
    if(has("parent")) pt.parent = "@name:"+g("parent");
    if(has("opsec"))  pt.op.sec  = nOf("opsec",0);
    if(has("opcost")) pt.op.cost = nOf("opcost",0);
    if(has("opkind")){
      const ok = g("opkind").toLowerCase();
      if(["material","joining","handling","adjust","test","other"].indexOf(ok)>=0) pt.op.kind = ok;
      else warn.push(rowRef+": opKind “"+g("opkind")+"” not recognised");
    }

    /* ---- minimum part count test ---- */
    pt.dfa.isBase             = yes(g("isbase"));
    pt.dfa.moveRelative       = yes(g("moves"));
    pt.dfa.differentMaterial  = yes(g("material_diff"));
    pt.dfa.separateForService = yes(g("service"));
    if(has("bcat")){
      const bc = g("bcat").toLowerCase();
      if(["fastener","connector","other"].indexOf(bc)>=0) pt.dfa.bCat = bc;
      else warn.push(rowRef+": bCat “"+g("bcat")+"” not recognised");
    }
    if(has("reason")) pt.dfa.reason = g("reason");

    /* ---- handling ---- */
    if(has("size")){ if(S.lib.dfa.hSize[g("size")]) pt.dfa.size=g("size"); else warn.push(rowRef+": size “"+g("size")+"” not recognised"); }
    if(has("sym")){ if(S.lib.dfa.hSym[g("sym")]) pt.dfa.sym=g("sym"); else warn.push(rowRef+": sym “"+g("sym")+"” not recognised"); }
    CSV_HANDLING_FLAGS.forEach(f=>{ if(has("h_"+f)) pt.dfa.hFlags[f] = yes(g("h_"+f)); });

    /* ---- fitting ---- */
    if(has("dir")){ if(S.lib.dfa.fDir[g("dir")]) pt.dfa.dir=g("dir"); else warn.push(rowRef+": dir “"+g("dir")+"” not recognised"); }
    CSV_FITTING_FLAGS.forEach(f=>{ if(has("f_"+f)) pt.dfa.fFlags[f] = yes(g("f_"+f)); });
    if(has("fix")){ if(S.lib.dfa.fFix[g("fix")]) pt.dfa.fix=g("fix"); else warn.push(rowRef+": fix “"+g("fix")+"” not recognised"); }
    if(has("fixcount")) pt.dfa.fixCount = nOf("fixcount",1);

    /* ---- cost: common ---- */
    const proc = g("process").toLowerCase();
    if(proc){
      if(["machining","fdm","powder","composite","foam","harness","purchased"].indexOf(proc)>=0) pt.cost.process = proc;
      else warn.push(rowRef+": process “"+proc+"” not recognised");
    }
    const basis = g("basis").toLowerCase();
    if(basis){
      if(["inherit","vendor","inhouse"].indexOf(basis)>=0) pt.cost.basis = basis;
      else warn.push(rowRef+": basis “"+basis+"” not recognised");
    }
    if(has("price")) pt.cost.purchasedPrice = nOf("price",0);

    const vol = nOf("volume",0), bx = nOf("bx",0), by = nOf("by",0), bz = nOf("bz",0);
    if(vol) ["machining","fdm","powder","foam"].forEach(k=>{ pt.cost[k].partVolume = vol; });
    if(bx){ pt.cost.fdm.bx=bx; pt.cost.powder.bx=bx; pt.cost.foam.bx=bx; pt.cost.machining.L=bx; }
    if(by){ pt.cost.fdm.by=by; pt.cost.powder.by=by; pt.cost.foam.by=by; pt.cost.machining.W=by; }
    if(bz){ pt.cost.fdm.bz=bz; pt.cost.powder.bz=bz; pt.cost.foam.bz=bz; pt.cost.machining.H=bz; }
    if(has("surfacearea")){ const a=nOf("surfacearea",0); pt.cost.machining.surfaceArea=a; pt.cost.fdm.surfaceArea=a; }

    const mid = g("material");
    if(mid){
      const m = S.lib.materials.find(x=>x.id===mid);
      if(m){
        if(m.group==="machining") pt.cost.machining.materialId=mid;
        if(m.group==="fdm")       pt.cost.fdm.materialId=mid;
        if(m.group==="powder")    pt.cost.powder.materialId=mid;
        if(m.group==="composite") pt.cost.composite.materialId=mid;
        if(m.group==="foam")      pt.cost.foam.materialId=mid;
        if(m.group==="wire")      pt.cost.harness.wireId=mid;
      } else warn.push(rowRef+": material “"+mid+"” is not in the library");
    }
    const kid = g("machine");
    if(kid){
      const k = S.lib.machines.find(x=>x.id===kid);
      if(k){
        if(k.group==="machining") pt.cost.machining.machineId=kid;
        if(k.group==="fdm")       pt.cost.fdm.machineId=kid;
        if(k.group==="powder")    pt.cost.powder.machineId=kid;
        if(k.group==="cure")      pt.cost.composite.machineId=kid;
        if(k.group==="foam")      pt.cost.foam.machineId=kid;
        if(k.group==="harness")   pt.cost.harness.machineId=kid;
      } else warn.push(rowRef+": machine “"+kid+"” is not in the library");
    }

    /* ---- cost: machining ---- */
    const mc = pt.cost.machining;
    if(has("stockform")){ const sf=g("stockform").toLowerCase(); if(sf==="block"||sf==="bar") mc.stockForm=sf; else warn.push(rowRef+": stockForm “"+sf+"” not recognised"); }
    if(has("stock_l")) mc.L = nOf("stock_l",0);
    if(has("stock_w")) mc.W = nOf("stock_w",0);
    if(has("stock_h")) mc.H = nOf("stock_h",0);
    if(has("stock_d")) mc.D = nOf("stock_d",0);
    if(has("setups"))      mc.setups      = nOf("setups",1);
    if(has("toolchanges")) mc.toolChanges = nOf("toolchanges",0);
    if(has("setupmin"))    mc.setupMin    = nOf("setupmin",0);
    if(has("batchsize"))   mc.batchSize   = nOf("batchsize",1);
    if(has("tolerance")){ if(S.lib.cost.tolerance[g("tolerance")]) mc.tolerance=g("tolerance"); else warn.push(rowRef+": tolerance “"+g("tolerance")+"” not recognised"); }
    if(has("finish")){ if(S.lib.cost.finish[g("finish")]) mc.finish=g("finish"); else warn.push(rowRef+": finish “"+g("finish")+"” not recognised"); }
    if(has("scrapcredit")) mc.scrapCredit = yes(g("scrapcredit"));
    const holes = [];
    for(let i=1;i<=3;i++){
      if(has("hole"+i+"_count")){
        holes.push({count:nOf("hole"+i+"_count",0), dia:nOf("hole"+i+"_dia",0), depth:nOf("hole"+i+"_depth",0)});
      }
    }
    if(holes.length) mc.holes = holes;

    /* ---- cost: FDM ---- */
    const fc = pt.cost.fdm;
    if(has("layerheight"))   fc.layerHeight   = nOf("layerheight",0.2);
    if(has("nozzle"))        fc.nozzle        = nOf("nozzle",0.4);
    if(has("walls"))         fc.walls         = nOf("walls",3);
    if(has("infillpct"))     fc.infillPct     = nOf("infillpct",25);
    if(has("supportpct"))    fc.supportPct    = nOf("supportpct",0);
    if(has("partsperplate")) fc.partsPerPlate = nOf("partsperplate",1);

    /* ---- cost: powder ---- */
    const pc = pt.cost.powder;
    if(has("partsperbuild"))    pc.partsPerBuild    = nOf("partsperbuild",0);
    if(has("packingoverride"))  pc.packingOverride  = nOf("packingoverride",0);

    /* ---- cost: composite ---- */
    const cc = pt.cost.composite;
    if(has("areamm2"))      cc.areaMm2       = nOf("areamm2",0);
    if(has("plies"))        cc.plies         = nOf("plies",1);
    if(has("debulks"))      cc.debulks       = nOf("debulks",0);
    if(has("curehr"))       cc.cureHr        = nOf("curehr",0);
    if(has("partspercure")) cc.partsPerCure  = nOf("partspercure",1);
    if(has("corethickness"))cc.coreThickness = nOf("corethickness",0);
    if(has("toolcost"))     cc.toolCost      = nOf("toolcost",0);
    if(has("toollife"))     cc.toolLife      = nOf("toollife",1);
    if(has("trimmin"))      cc.trimMin       = nOf("trimmin",0);
    if(has("ndtmin"))       cc.ndtMin        = nOf("ndtmin",0);
    if(has("coreid")){
      const core = S.lib.materials.find(x=>x.id===g("coreid"));
      if(core) cc.coreId = g("coreid"); else if(g("coreid")) warn.push(rowRef+": coreId “"+g("coreid")+"” is not in the library");
    }

    /* ---- cost: foam ---- */
    const fo = pt.cost.foam;
    if(has("foammethod")){
      const fm = g("foammethod").toLowerCase();
      if(fm==="cnc"||fm==="moulded") fo.method = fm; else warn.push(rowRef+": foamMethod “"+fm+"” not recognised");
    }
    if(has("cavities")) fo.cavities = nOf("cavities",1);
    if(has("cyclesec")) fo.cycleSec = nOf("cyclesec",0);
    if(has("toolcost") && proc==="foam") fo.toolCost = nOf("toolcost",0);
    if(has("toollife") && proc==="foam") fo.toolLife = nOf("toollife",1);

    /* ---- cost: harness ---- */
    const hc = pt.cost.harness;
    if(has("wireid")){
      const w = S.lib.materials.find(x=>x.id===g("wireid"));
      if(w && w.group==="wire") hc.wireId = g("wireid"); else warn.push(rowRef+": wireId “"+g("wireid")+"” is not a wire in the library");
    }
    if(has("lengthmm"))   hc.lengthMm   = nOf("lengthmm",0);
    if(has("cores"))      hc.cores      = nOf("cores",1);
    if(has("branches"))   hc.branches   = nOf("branches",1);
    if(has("connapins"))  hc.connAPins  = nOf("connapins",0);
    if(has("connaprice")) hc.connAPrice = nOf("connaprice",0);
    if(has("connbpins"))  hc.connBPins  = nOf("connbpins",0);
    if(has("connbprice")) hc.connBPrice = nOf("connbprice",0);
    if(has("splices"))    hc.splices    = nOf("splices",0);
    if(has("sleevingmm")) hc.sleevingMm = nOf("sleevingmm",0);
    if(has("heatshrink")) hc.heatshrink = nOf("heatshrink",0);
    if(has("labels"))     hc.labels     = nOf("labels",0);
    if(has("ties"))       hc.ties       = nOf("ties",0);
    if(has("testmin"))    hc.testMin    = nOf("testmin",0);

    S.parts.push(pt); added++;
  });

  /* Resolve the named parent links now that every row exists. A name that
     matches nothing, or matches something that is not a sub-assembly, is
     reported rather than silently dropping the item out of the tree. */
  S.parts.forEach(pt=>{
    if(typeof pt.parent !== "string" || pt.parent.indexOf("@name:")!==0) return;
    const wanted = pt.parent.slice(6);
    const target = S.parts.find(q=>q!==pt && q.name.trim().toLowerCase()===wanted.trim().toLowerCase());
    if(!target){ pt.parent=""; warn.push("“"+pt.name+"”: parent “"+wanted+"” not found — left at the top level"); return; }
    if(target.itemType!=="subassembly"){
      target.itemType = "subassembly";
      warn.push("“"+target.name+"” was named as a parent, so it has been made a sub-assembly");
    }
    pt.parent = target.id;
  });

  save(); render();
  toast(added+" item"+(added===1?"":"s")+" imported \u2014 \u201C"+(variant().name||"this option")+
        "\u201D now holds "+S.parts.length+
        (warn.length?" \u00b7 "+warn.length+" warning"+(warn.length===1?"":"s"):""));
  if(warn.length) alert("Imported "+added+" part"+(added===1?"":"s")+", but some values were not recognised and the defaults were kept:\n\n"+
    warn.slice(0,25).join("\n")+(warn.length>25?"\n… and "+(warn.length-25)+" more":""));
}

function csvOut(){
  const c = costProduct();
  const parentName = id => { const q = S.parts.find(x=>x.id===id); return q? q.name : ""; };
  const head = ["Part","Part no","Module","Item type","Parent","Min part category","Qty","Class",
                "Handling index","Fitting index","Handling s","Fitting s","Assembly s (ext)",
                "Process","Basis","Material cost","Conversion","Unit cost","Extended","Mass g (unit)","Mass g (ext)","Mass source",
                "Field assembly","Tool free","Domain","Service class","Solder joints","Access depth",
                "Removals/life","Service event min","Service event cost","Lifetime service cost","Justification"];
  const lines = [head];
  c.rows.forEach(({pt,c:cc})=>{
    const r = dfaPart(pt);
    lines.push([pt.name, pt.partNo, pt.module||"", ITEM_TYPES[pt.itemType]||pt.itemType, parentName(pt.parent),
      r.isOp ? "Operation" : MIN_PART_CATS[r.cat].label.split(" \u2014 ")[0],
      r.qty, r.isOp?"op":r.essential?"A":"B", r.handlingIndex, r.fittingIndex,
      r.handlingSec, r.fittingSec, r.totalSec, procLabel(pt.cost.process), cc.basis,
      r2(cc.material), r2(cc.conversion), r2(cc.unit), r2(cc.extended),
      r2(cc.massG), r2(cc.massExtended), cc.massSource,
      pt.fieldAssembly?"yes":"no", pt.toolFree?"yes":"no",
      DOMAINS[pt.domain]||pt.domain, cc.service.cls, cc.service.solder, cc.service.depth,
      cc.service.removals, cc.service.eventMin, r2(cc.service.eventCost), r2(cc.service.lifetimeCost),
      pt.dfa.reason||""]);
  });
  const d = c.dfa;
  lines.push([]);
  lines.push(["Design efficiency %", d.designEff]);
  lines.push(["Parts total / essential", d.nTotal, d.nEss]);
  lines.push(["Assembly time s", d.totalSec]);
  lines.push(["Of which operations s", d.opSec]);
  lines.push(["Sub-assemblies / operations", d.nSub, d.nOps]);
  lines.push(["Design option", variant().name]);
  lines.push(["Assembly efficiency %", d.efficiency]);
  lines.push(["Feeding ratio", d.feedingRatio]);
  lines.push(["Fitting ratio", d.fittingRatio]);
  lines.push(["Parts cost", r2(c.partsTotal)]);
  lines.push(["Assembly labour", r2(c.assemblyLabour)]);
  lines.push(["Total product cost", r2(c.total)]);
  lines.push(["Mass roll-up g", r1(c.massG)]);
  lines.push(["Mass budget g", num(S.meta.massTargetG)]);
  lines.push(["Parts with no mass recorded", c.unknownMass]);
  lines.push(["Field deployment s", d.fieldSec]);
  lines.push(["Field parts / needing a tool", d.fieldParts, d.fieldToolParts]);
  lines.push(["Lifetime service cost", r2(c.svc.lifetimeCost)]);
  lines.push(["Soldered joints total / on serviceable items", c.svc.solderJoints, c.svc.trapped.length]);
  lines.push([]);
  lines.push(["Module","Parts","Design eff %","Mass g","Assembly s","Cost"]);
  c.modules.forEach(g=>lines.push([g.name, g.parts, g.designEff, r1(g.massG), r2(g.sec), r2(g.cost)]));
  const body = lines.map(r=>r.map(v=>{
    const s = String(v==null?"":v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\n");
  download((S.meta.name||"analysis").replace(/[^\w-]+/g,"_")+"_results.csv", body, "text/csv");
}

/* Two places this page runs, and they save files differently.

   Opened from disk it is an ordinary browser download. Served as a hosted
   page the sandbox blocks a download the page starts itself, so the viewer's
   shell is asked to save instead — it shows a confirmation and the viewer may
   decline. If neither route is open the text goes to the clipboard, because
   losing an export you asked for is worse than an extra paste. */
let _saver, _saverAsked = false;
async function download(name, text, mime){
  if(!_saverAsked){
    _saverAsked = true;
    try{ _saver = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }
    catch(e){ _saver = null; }
  }
  if(_saver){
    try{
      await _saver.save({filename:name, data:text});
      toast("Saved " + name);
      return;
    }catch(err){
      const code = err && err.code;
      if(code === "declined") return;               // the viewer said no; that is an answer
      if(code === "rate_limited"){ toast("A save is already open — finish that one first"); return; }
      // anything else: fall through to the routes below
    }
  }
  try{
    const blob = new Blob([text],{type:(mime||"application/json")+";charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},0);
    return;
  }catch(e){ /* blocked — clipboard below */ }
  try{
    await navigator.clipboard.writeText(text);
    toast(name + " copied to the clipboard — paste it into a file");
  }catch(e){
    alert("This page cannot save files here. Copy the text below into " + name + ":\n\n" + text.slice(0, 2000) +
          (text.length > 2000 ? "\n\n… truncated. Open the tool from a local copy to export in full." : ""));
  }
}

/* ============================================================
   10. EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  // selecting a part from the list: the marker sits on the row, not a button
  const row = e.target.closest("[data-sel]");
  if(row && !e.target.closest("button")){ ui.selPart = row.dataset.sel; render(); return; }

  const t = e.target.closest("button");
  if(!t) return;
  const d = t.dataset;

  if(d.tab){ ui.tab=d.tab; render(); return; }
  if(d.libtab){ ui.libTab=d.libtab; render(); return; }

  if(t.id==="btnAddPart"){ addItem(samplePart()); return; }
  if(t.id==="btnAddSub"){
    const p = samplePart(); p.name="New sub-assembly"; p.itemType="subassembly"; p.cost.process="purchased";
    addItem(p); return;
  }
  if(t.id==="btnAddOperation"){
    const sel = document.getElementById("selOperation");
    const o = S.lib.operations.find(x=>x.id===(sel&&sel.value)) || S.lib.operations[0];
    const p = samplePart();
    p.name = o.name; p.itemType="operation"; p.op = {kind:o.kind, sec:o.sec, cost:o.cost};
    addItem(p); return;
  }
  if(t.id==="btnAddFastener"){
    const sel = document.getElementById("selFastener");
    const f = S.lib.fasteners.find(x=>x.id===(sel&&sel.value)) || S.lib.fasteners[0];
    const p = samplePart();
    p.name = f.name; p.massG = f.massG; p.module = "Fasteners";
    p.cost.process = "purchased"; p.cost.purchasedPrice = f.price;
    Object.assign(p.dfa, {bCat:"fastener", size:f.size, sym:"oneWay", dir:f.dir,
      fix:f.fix, fixCount:1, hFlags:{nests:true},
      reason:"Standard fastener from the library."});
    addItem(p); return;
  }
  if(d.dup){
    const src = S.parts.find(x=>x.id===d.dup);
    const cp = JSON.parse(JSON.stringify(src)); cp.id=uid(); cp.name=src.name+" (copy)";
    S.parts.splice(S.parts.indexOf(src)+1,0,cp); ui.selPart=cp.id; save(); render(); return;
  }
  if(d.del){
    const src = S.parts.find(x=>x.id===d.del);
    const kids = S.parts.filter(p=>p.parent===src.id);
    const msg = kids.length
      ? "Delete “"+src.name+"”? Its "+kids.length+" item(s) move up to sit alongside it rather than being deleted."
      : "Delete “"+src.name+"”?";
    if(confirm(msg)){
      kids.forEach(k=>{ k.parent = src.parent; });
      S.parts.splice(S.parts.indexOf(src),1);
      ui.selPart = S.parts.length? S.parts[0].id : null; save(); render();
    }
    return;
  }

  /* ---- design options ---- */
  if(d.usevar){ useVariant(d.usevar); save(); render(); return; }
  if(d.clonevar){
    const src = S.variants.find(v=>v.id===d.clonevar);
    const v = addVariant(d.clonevar, src.name+" (copy)", src.note);
    useVariant(v.id); save(); render(); toast("Editing "+v.name); return;
  }
  if(d.delvar){
    const v = S.variants.find(x=>x.id===d.delvar);
    if(S.variants.length<2) return;
    if(confirm("Delete the option “"+v.name+"” and its part list?")){
      S.variants.splice(S.variants.indexOf(v),1);
      if(S.active===v.id) useVariant(S.variants[0].id);
      save(); render();
    }
    return;
  }
  if(t.id==="btnNewVariant"){
    const v = addVariant(S.active, "Option "+S.variants.length, "");
    useVariant(v.id); save(); render(); toast("Cloned — you are now editing "+v.name); return;
  }
  if(t.id==="btnStdOptions"){
    if(!confirm("Add three options cloned from the one you are editing — materials, processes and assembly?")) return;
    addVariant(S.active, "Option 1 — materials", "Same design, different materials.");
    addVariant(S.active, "Option 2 — processes", "Same design and materials, different manufacturing processes.");
    addVariant(S.active, "Option 3 — assembly",  "Parts consolidated and joints changed to cut assembly time.");
    save(); render(); toast("Three options added — edit each in turn"); return;
  }
  if(d.report){ ui.report = d.report; render(); return; }
  if(t.id==="btnAddHole"){
    const pt = S.parts.find(x=>x.id===ui.selPart);
    pt.cost.machining.holes.push({count:1,dia:5,depth:10}); save(); render(); return;
  }
  if(d.delhole!==undefined){
    const pt = S.parts.find(x=>x.id===ui.selPart);
    pt.cost.machining.holes.splice(+d.delhole,1); save(); render(); return;
  }
  if(d.delfast!==undefined){ S.lib.fasteners.splice(+d.delfast,1); save(); render(); return; }
  if(d.delop!==undefined){ S.lib.operations.splice(+d.delop,1); save(); render(); return; }
  if(t.id==="btnAddFastLib"){
    S.lib.fasteners.push({id:"f"+Math.random().toString(36).slice(2,6), name:"New fastener",
      price:1, massG:1, fix:"screw", size:"small", dir:"topDown"});
    save(); render(); return;
  }
  if(t.id==="btnAddOpLib"){
    S.lib.operations.push({id:"o"+Math.random().toString(36).slice(2,6), name:"New operation",
      kind:"other", sec:30, cost:0});
    save(); render(); return;
  }
  if(d.delmat!==undefined){ S.lib.materials.splice(+d.delmat,1); save(); render(); return; }
  if(d.delmach!==undefined){ S.lib.machines.splice(+d.delmach,1); save(); render(); return; }
  if(d.addmat){
    const g=d.addmat, id="m"+Math.random().toString(36).slice(2,6);
    const base = g==="machining" ? {density:7.8,pricePerKg:100,scrapPerKg:30,mrr:9000,vc:90,fpr:0.12}
               : g==="powder"    ? {density:1.0,bulkDensity:0.45,pricePerKg:4000}
               : g==="wire"      ? {pricePerM:30,gramsPerM:4}
               : g==="composite" ? {gsm:200,pricePerKg:2500,density:1.55,prepreg:false}
               : g==="foam"      ? {density:60,pricePerKg:450}
               :                   {density:1.24,pricePerKg:1200};
    S.lib.materials.push(Object.assign({id,name:"New "+g+" material",group:g},base));
    save(); render(); return;
  }

  if(t.id==="btnExport"||t.id==="btnExport2"){
    download((S.meta.name||"analysis").replace(/[^\w-]+/g,"_")+".json", projectJson(2));
    toast("Exported"); return;
  }
  if(t.id==="btnCsvOut"||t.id==="btnCsvOut2"||t.id==="btnCsvOut2r"){ csvOut(); return; }
  if(t.id==="btnCsvTemplate"){
    const headers = CSV_COLUMNS.filter(c=>c[1].indexOf(" / ")<0).map(c=>c[1]);
    download("bom-template.csv", headers.join(",")+"\n", "text/csv");
    return;
  }
  if(t.id==="btnPasteClear"){ const b=document.getElementById("pasteBox"); if(b){ b.value=""; b.focus(); } return; }
  if(t.id==="btnPasteLoad"){
    const box = document.getElementById("pasteBox");
    const txt = box ? box.value.trim() : "";
    if(!txt){ toast("Nothing pasted yet"); if(box) box.focus(); return; }
    try{ loadAnyText(txt); }
    catch(err){ alert("Could not read that: "+err.message); }
    return;
  }
  if(t.id==="btnReset"){ if(confirm("Discard everything and reload the sample project?")){ S=sampleProject(); ui.selPart=null; save(); render(); } return; }
  if(t.id==="btnClear"){ if(confirm("Delete all parts? The library and rates are kept.")){ setParts([]); ui.selPart=null; save(); render(); } return; }
});

document.addEventListener("input", e=>{
  const el = e.target; const p = el.dataset.p;
  if(!p) return;
  let v;
  if(el.type==="checkbox") v = el.dataset.on ? (el.checked ? el.dataset.on : el.dataset.off) : el.checked;
  else if(el.type==="number") v = el.value===""?0:parseFloat(el.value);
  else v = el.value;
  setPath(p, v);
  save();
  if(el.type!=="checkbox" && el.tagName!=="SELECT") refreshLive();
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(!el.dataset.p) return;
  if(el.dataset.rerender) render();
});

function refreshLive(){
  // update the numbers that sit outside the form without rebuilding it (keeps focus)
  const pt = S.parts.find(x=>x.id===ui.selPart);
  const bar = document.querySelector(".livebar");
  if(ui.tab==="parts" && pt && bar){
    const r = dfaPart(pt), c = costPart(pt);
    bar.innerHTML =
      '<div><b>Class</b>'+(r.essential?"A – essential":"B – candidate")+'</div>'+
      '<div><b>Handling</b>'+r.handlingIndex+(r.overHandling?' ⚠':'')+'</div>'+
      '<div><b>Fitting</b>'+r.fittingIndex+(r.overFitting?' ⚠':'')+'</div>'+
      '<div><b>Assembly</b>'+r.unitSec+' s ×'+r.qty+'</div>'+
      '<div><b>Unit cost</b>'+CUR+fmt(c.unit)+'</div>'+
      '<div><b>Extended</b>'+CUR+fmt(c.extended)+'</div>';
  }
}

/* Replace the whole analysis with a saved one. Loading a project discards
   parts, every design option and the whole Library. Reset and Clear both ask
   first; this loses the most, so it asks too. */
function loadProject(o){
  const items = S.variants.reduce((a,v)=>a+v.parts.length,0);
  if(items > 0){
    const incoming = (o.meta && o.meta.name) || "the imported project";
    const ok = confirm(
      "Replace \u201C"+(S.meta.name||"this project")+"\u201D with \u201C"+incoming+"\u201D?\n\n"+
      "You would lose "+items+" item"+(items===1?"":"s")+" across "+S.variants.length+
      " design option"+(S.variants.length===1?"":"s")+", and every rate and coefficient in the Library. "+
      "This cannot be undone.\n\n"+
      "Cancel first and use Export if you want to keep the current project.");
    if(!ok){ toast("Import cancelled \u2014 nothing changed"); return; }
  }
  S = migrate(o); S.meta.sample = false; ui.selPart=null; save(); render();
  toast("Loaded \u201C"+(S.meta.name||"project")+"\u201D \u2014 "+S.parts.length+" items, "+S.variants.length+" option(s)");
}

/* Both pickers hand their text to the same reader, so a project dropped on the
   BOM control still loads and a BOM dropped on Import still imports. */
function readPickedFile(e){
  const f = e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const rd = new FileReader();
  rd.onerror = ()=>alert("Could not read \u201C"+f.name+"\u201D. If the file picker is not working here, "+
                         "the Data tab has a box you can paste into instead.");
  rd.onload = ()=>{
    try{ loadAnyText(rd.result); }
    catch(err){ alert("Could not read \u201C"+f.name+"\u201D: "+err.message); }
  };
  rd.readAsText(f);
}
document.getElementById("fileImport").addEventListener("change", readPickedFile);
document.getElementById("fileCsv").addEventListener("change", readPickedFile);

/* One entry point for every way text gets in — a picked file or a paste. A
   project JSON replaces the whole analysis; anything else is a BOM. */
function loadAnyText(text){
  const t = String(text).replace(/^\uFEFF/, "").trim();
  if(t.charAt(0) === "{"){
    let o;
    try{ o = JSON.parse(t); }catch(e){ throw new Error("that looks like JSON but will not parse — "+e.message); }
    if(o && (o.parts || o.variants)) return loadProject(o);
    throw new Error("that JSON is not a saved project and not a list of parts. A project has a “variants” key; "+
                    "a BOM is a list, starting with “[”.");
  }
  importCsv(toRowText(t));
}

/* People convert the Parts sheet to JSON as often as to CSV, and an array of
   row objects carries exactly the same information. Flatten it to CSV rather
   than make them convert twice. Anything that is not such an array is passed
   through untouched, so a real CSV is unaffected. */
function toRowText(text){
  const t = String(text).replace(/^\uFEFF/, "").trim();
  if(t.charAt(0) !== "[") return text;
  let rows;
  try{ rows = JSON.parse(t); }catch(e){ return text; }
  if(!Array.isArray(rows) || !rows.length) return text;
  if(typeof rows[0] !== "object" || rows[0] === null || Array.isArray(rows[0]))
    throw new Error("that JSON is a list, but not a list of rows — each entry needs to be one part, with the column names as its keys");
  /* Union of every row's keys, first-seen order, so a row that omits a
     trailing empty column does not shift the ones after it. */
  const cols = [];
  rows.forEach(r=>{ for(const k in r) if(cols.indexOf(k)<0) cols.push(k); });
  const esc = v => {
    const x = (v==null) ? "" : String(v);
    return /[",\n\r]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x;
  };
  return [cols.map(esc).join(",")]
    .concat(rows.map(r=>cols.map(c=>esc(r[c])).join(",")))
    .join("\n");
}

/* ---- boot ---- */
S = load();
render();
document.getElementById("buildTag").textContent = BUILD;
</script>
