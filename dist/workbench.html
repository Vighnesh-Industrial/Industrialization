<title>Assembly &amp; Cost Workbench</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --ground:#f2f4f4; --surface:#fff; --surface-2:#e9edee; --surface-3:#dfe5e6;
  --ink:#161b1e; --ink-2:#3d4a50; --steel:#6d7c84;
  --rule:#d3dadc; --rule-strong:#b3bfc3;
  --accent:#0f5b6b; --accent-ink:#fff; --accent-soft:#e0eef1;
  --ok:#2f6b46; --ok-soft:#e2efe7;
  --warn:#8a5a12; --warn-soft:#f5ecd9;
  --risk:#993122; --risk-soft:#f6e5e1;
  --shadow:0 1px 0 rgba(22,27,30,.04), 0 8px 24px -18px rgba(22,27,30,.45);
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101416; --surface:#171d20; --surface-2:#1e262a; --surface-3:#263034;
    --ink:#e7ecec; --ink-2:#b3c0c4; --steel:#8a9aa0;
    --rule:#2a3439; --rule-strong:#3a464c;
    --accent:#6fc4d6; --accent-ink:#0b1214; --accent-soft:#15343c;
    --ok:#7fc79b; --ok-soft:#17301f;
    --warn:#d9ad61; --warn-soft:#33280f;
    --risk:#e08d7c; --risk-soft:#3a1f1a;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#101416; --surface:#171d20; --surface-2:#1e262a; --surface-3:#263034;
  --ink:#e7ecec; --ink-2:#b3c0c4; --steel:#8a9aa0;
  --rule:#2a3439; --rule-strong:#3a464c;
  --accent:#6fc4d6; --accent-ink:#0b1214; --accent-soft:#15343c;
  --ok:#7fc79b; --ok-soft:#17301f;
  --warn:#d9ad61; --warn-soft:#33280f;
  --risk:#e08d7c; --risk-soft:#3a1f1a;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- app frame ---- */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--rule-strong)}
.topbar-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand h1{font-size:16px}
.brand .ver{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{
  font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--ink-2);
  background:transparent;border:1px solid transparent;border-radius:2px;padding:6px 12px;cursor:pointer}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.topact{display:flex;gap:8px}

main{max-width:1400px;margin:0 auto;padding:22px 20px 80px}

/* ---- generic bits ---- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card > h2{font-size:16px;margin-bottom:2px}
.card > .sub{color:var(--steel);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}

.btn{
  font-family:var(--f-ui);font-size:13px;font-weight:500;padding:7px 13px;border-radius:2px;cursor:pointer;
  background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);
  display:inline-block;line-height:1.55;text-align:center;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--risk);border-color:var(--rule-strong)}
.btn.sm{font-size:12px;padding:4px 9px}
/* A file input reached through its own <label> opens the picker natively. The
   scripted .click() it used to rely on is the first thing an embedding sandbox
   blocks, so the input is only visually hidden, never display:none. */
.filebtn input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}

label.f{display:block}
label.f > span.lab{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--steel);margin-bottom:4px}
label.f > span.hint{display:block;font-size:11.5px;color:var(--steel);margin-top:3px;line-height:1.4}
input[type=text],input[type=number],select,textarea{
  width:100%;font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:2px;padding:6px 8px}
textarea{font-family:var(--f-ui);min-height:60px;resize:vertical}
input:disabled{background:var(--surface-2);color:var(--steel)}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:3px 0;cursor:pointer}
label.ck input{margin:3px 0 0;accent-color:var(--accent);flex:0 0 auto}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);
   text-align:left;font-weight:500;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--rule-strong);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--rule);color:var(--ink-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.over{color:var(--risk)}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
table input,table select{padding:4px 6px;font-size:12px}

.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.risk{background:var(--risk-soft);color:var(--risk)}
.chip.neutral{background:var(--surface-2);color:var(--steel)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* ---- KPI tiles ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.kpi:last-child:nth-child(4n+1){grid-column:span 4}
.kpi:last-child:nth-child(4n+2){grid-column:span 3}
.kpi:last-child:nth-child(4n+3){grid-column:span 2}
@media(max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:last-child:nth-child(n){grid-column:auto}
  .kpi:last-child:nth-child(2n+1){grid-column:span 2}
}
@media(max-width:560px){.kpis{grid-template-columns:1fr}.kpi:last-child:nth-child(n){grid-column:auto}}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:6px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--steel);margin-left:3px}
.kpi .m{font-size:11.5px;color:var(--steel);margin-top:5px;line-height:1.35}
.meter{height:4px;background:var(--surface-3);margin-top:9px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter i.ok{background:var(--ok)} .meter i.warn{background:var(--warn)} .meter i.risk{background:var(--risk)}

/* ---- parts layout ---- */
.split{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow)}
.panel > header{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel > header h2{font-size:14px;margin-right:auto}
.panel > .body{padding:16px}
fieldset{border:none;border-top:1px solid var(--rule);margin:0 0 4px;padding:16px 0 4px}
fieldset:first-of-type{border-top:none;padding-top:0}
legend{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:0;margin-bottom:10px}
.livebar{display:flex;gap:18px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--rule);padding:10px 14px;margin-bottom:14px}
.livebar div{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.livebar b{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);font-weight:500}

ul.flags{list-style:none;margin:0;padding:0}
ul.flags li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
ul.flags li:last-child{border-bottom:none}
ul.flags li b{color:var(--ink);font-weight:600}

.note{font-size:12.5px;color:var(--steel);line-height:1.5}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.right{text-align:right}
.rowact{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--steel);font-size:13px}
details.calc{margin-top:10px;border-top:1px dashed var(--rule-strong);padding-top:10px}
details.calc summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details.calc table{margin-top:10px;font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--ground);
  font-family:var(--f-mono);font-size:12px;padding:9px 16px;border-radius:2px;z-index:100;box-shadow:var(--shadow)}

/* ---- structure tree ---- */
.tree{list-style:none;margin:0;padding:6px 0}
.tree li{margin:0}
.tnode{display:flex;align-items:baseline;gap:8px;padding:5px 14px;cursor:pointer;border-left:3px solid transparent;font-size:13px}
.tnode:hover{background:var(--surface-2)}
.tnode.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.tnode .tname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .tmeta{font-family:var(--f-mono);font-size:10.5px;color:var(--steel);font-variant-numeric:tabular-nums;white-space:nowrap}
.tglyph{font-family:var(--f-mono);font-size:10px;color:var(--steel);width:1.2em;flex:none;text-align:center}
.tnode.op .tname{color:var(--steel);font-style:italic}
.tnode.sub .tname{font-weight:600}

/* ---- charts ---- */
.chart{border:1px solid var(--rule);background:var(--surface);padding:14px 16px;margin-top:14px}
.chart-t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:12px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:11.5px;color:var(--ink-2)}
.chart-legend .lg{display:inline-flex;align-items:center;gap:6px}
.chart-legend .lg i{width:11px;height:3px;display:inline-block}
.linechart{width:100%;height:auto;max-height:280px;display:block}
.linechart .ax{font-family:var(--f-mono);font-size:9.5px;fill:var(--steel)}
.barrow{display:grid;grid-template-columns:minmax(90px,1.1fr) 3fr minmax(70px,auto);gap:10px;align-items:center;margin-bottom:6px}
.barlab{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bartrack{background:var(--surface-2);height:14px;position:relative;display:block}
.bartrack i{position:absolute;left:0;top:0;bottom:0;display:block}
.barval{font-family:var(--f-mono);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
@media(max-width:560px){ .barrow{grid-template-columns:1fr 2fr auto} }

/* ---- design options ---- */
.optcard{border:1px solid var(--rule);background:var(--surface);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.optcard.active{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.optcard .ob{flex:1 1 auto;min-width:0}
.optcard h3{font-size:14px;margin:0 0 3px}
.delta.up{color:var(--risk)} .delta.down{color:var(--ok)} .delta.flat{color:var(--steel)}
.rep h3{font-size:13px;margin:18px 0 6px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

@media print{
  .topbar,.topact,.noprint{display:none!important}
  body{background:#fff}
  .card,.panel{box-shadow:none;break-inside:avoid}
  .chart{break-inside:avoid}
}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Assembly &amp; Cost Workbench</h1>
      <span class="ver">DFA + should-cost · <span id="buildTag"></span></span>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="topact">
      <button class="btn sm" id="btnExport">Export</button>
      <label class="btn sm filebtn" title="Load a saved analysis (project JSON)">Import<input type="file" id="fileImport" accept=".json,application/json"></label>
      <label class="btn sm filebtn" title="Add parts from a BOM (CSV or JSON)">BOM<input type="file" id="fileCsv" accept=".csv,.txt,.json,text/csv,application/json"></label>
    </div>
  </div>
</div>

<main id="app"></main>

<script>
"use strict";
/* ============================================================
   1. DEFAULT LIBRARY DATA

const BUILD = "build 2026-09-16-7";  // shown in the header so a stale page is obvious

const DEFAULT_LIB = {

    marginPct: 12,             // supplier margin (vendor basis)
    packFreightPct: 2,         // packaging + inbound freight
    idealAssemblySec: 3.0      // theoretical time for an ideal part (efficiency denominator)
  },

  materials: [
    // machining stock
    {id:"al6061", name:"Aluminium 6061-T6", density:2.70, pricePerKg:420,  scrapPerKg:130, mrr:22000, vc:250, fpr:0.15, group:"machining"},

    {id:"cf200d", name:"CF dry fabric 200 gsm",        gsm:200, pricePerKg:2200, density:1.55, prepreg:false, group:"composite"},
    {id:"cf600d", name:"CF dry fabric 600 gsm biax",   gsm:600, pricePerKg:2000, density:1.55, prepreg:false, group:"composite"},
    {id:"gf200d", name:"Glass fabric 200 gsm",         gsm:200, pricePerKg:420,  density:1.90, prepreg:false, group:"composite"},
    {id:"kev170", name:"Aramid fabric 170 gsm",        gsm:170, pricePerKg:3200, density:1.44, prepreg:false, group:"composite"},
    // foam and core: density in kg/m3
    {id:"epp60",  name:"EPP bead 60 kg/m3",         density:60, pricePerKg:450,  group:"foam"},

  machines: [
    {id:"vmc",   name:"3-axis VMC (small)",  group:"machining", ratePerHour:900,  maxRpm:8000,  toolChangeSec:8,  rapidSec:2},

    {id:"oven",      name:"Composite cure oven",                  group:"cure", ratePerHour:600},
    {id:"autoclave", name:"Autoclave",                            group:"cure", ratePerHour:3500},
    {id:"foamMould", name:"EPP/EPO bead moulding machine",        group:"foam", ratePerHour:1400, cycleSec:180},
    {id:"foamCnc",   name:"CNC foam router / hot wire",           group:"foam", ratePerHour:450, mrr:900000},
    {id:"bench",     name:"Harness bench (crimp + test)",         group:"harness", ratePerHour:150}

function sampleProject(){

  const P = (name, module, dfa, cost, extra) => {
    const pt = samplePart();
    pt.name = name; pt.module = module;
    Object.assign(pt.dfa, dfa);
    pt.cost.process = cost.process;
    if(cost.set) Object.assign(pt.cost[cost.process==="purchased"?"machining":cost.process], cost.set);
    if(cost.process==="purchased") pt.cost.purchasedPrice = cost.price||0;
    Object.assign(pt, extra||{});
    return pt;
  };

  const parts = [
    P("Wing core, foam","Wing LH",
      {moveRelative:false,differentMaterial:true,separateForService:false,

      {process:"foam", set:{materialId:"xps35",machineId:"foamCnc",method:"cnc",
        bx:900,by:180,bz:38,partVolume:2400000}}),

    P("Spar, CFRP tube","Wing LH",
      {moveRelative:false,differentMaterial:false,separateForService:true,
       reason:"Removed to break the wing down for transport.",
       size:"large",sym:"oneWay",hFlags:{},dir:"side",fFlags:{resistance:true},fix:"quickRel",fixCount:2},
      {process:"purchased", price:2400}, {massG:145, fieldAssembly:true, toolFree:true}),

    P("Wing root fitting","Wing LH",
      {moveRelative:false,differentMaterial:false,separateForService:true,
       reason:"Carries the wing-to-fuselage joint load and must be separable in the field.",
       size:"normal",sym:"twoWay",hFlags:{},dir:"side",
       fFlags:{notSelfLocating:true,torqueSpec:true,threadlock:true},fix:"screw",fixCount:4},
      {process:"machining", set:{materialId:"al6061",machineId:"vmc",stockForm:"block",
        L:70,W:45,H:26,partVolume:31000,setups:2,toolChanges:5,setupMin:45,batchSize:40,
        tolerance:"medium",finish:"good",holes:[{count:4,dia:5,depth:26},{count:2,dia:8,depth:20}]}}),

    P("Boom, CFRP tube","Boom LH",
      {moveRelative:false,differentMaterial:false,separateForService:true,
       reason:"Folds or detaches for transport.",
       size:"large",sym:"oneWay",hFlags:{},dir:"side",fFlags:{},fix:"quickRel",fixCount:2},
      {process:"purchased", price:1850}, {massG:210, fieldAssembly:true, toolFree:true}),

    P("VTOL motor mount","Boom LH",
      {moveRelative:false,differentMaterial:false,separateForService:true,
       reason:"Motor is a service item.",
       size:"normal",sym:"twoWay",hFlags:{},dir:"topDown",
       fFlags:{torqueSpec:true,threadlock:true},fix:"screw",fixCount:4},
      {process:"machining", set:{materialId:"al6061",machineId:"vmc",stockForm:"block",
        L:56,W:56,H:14,partVolume:16500,setups:1,toolChanges:4,setupMin:30,batchSize:60,
        tolerance:"medium",finish:"asMachined",holes:[{count:8,dia:4,depth:14}]}},
      {domain:"electromech"}),

    P("VTOL motor","Boom LH",
      {moveRelative:true,differentMaterial:false,separateForService:true,
       reason:"Rotating assembly.",
       size:"normal",sym:"twoWay",hFlags:{},dir:"topDown",
       fFlags:{torqueSpec:true,connectorMate:true},fix:"screw",fixCount:4},
      {process:"purchased", price:4200},
      {massG:186, domain:"electromech",
       service:{cls:"depot", removalsPerLife:2, accessDepth:1, destructive:false, solderJoints:3, reworkMin:0}}),

    P("ESC to motor harness","Boom LH",
      {moveRelative:false,differentMaterial:true,separateForService:true,
       reason:"Conductor - must be insulated from the structure and replaceable.",
       size:"normal",sym:"nonObvious",hFlags:{flexible:true,nests:true},dir:"side",
       fFlags:{routing:true,connectorMate:true,restrictedVision:true},fix:"cableTie",fixCount:4},
      {process:"harness", set:{wireId:"w14",lengthMm:620,cores:3,branches:1,

       service:{cls:"depot", removalsPerLife:2, accessDepth:3, destructive:false, solderJoints:0, reworkMin:0}}),

    P("Avionics tray","Fuselage",
      {moveRelative:false,differentMaterial:false,separateForService:false,
       reason:"Candidate for consolidation into the fuselage shell as a moulded-in feature.",
       size:"normal",sym:"oneWay",hFlags:{},dir:"topDown",
       fFlags:{esd:true},fix:"screw",fixCount:6},
      {process:"fdm", set:{materialId:"pa12cf",machineId:"fdmInd",bx:180,by:90,bz:22,
        partVolume:41000,layerHeight:0.2,nozzle:0.4,walls:4,infillPct:30,supportPct:6,partsPerPlate:2}},
      {domain:"electromech"}),

    P("Flight controller","Fuselage",

    P("Main power harness","Fuselage",

    P("Payload gimbal","Payload",
      {moveRelative:true,differentMaterial:false,separateForService:true,

  /* Structure chart for the sample: the avionics tray is the base part
     everything else is built onto, and the boom items hang off a sub-assembly
     so the tree has something to show. */
  const byName = n => parts.find(p=>p.name===n);
  const tray = byName("Avionics tray");
  if(tray) tray.dfa.isBase = true;
  const screw = byName("M4 × 12 cap screw");
  if(screw) screw.dfa.bCat = "fastener";

  const boomSub = samplePart();
  boomSub.name = "Boom LH assembly"; boomSub.module = "Boom LH";
  boomSub.itemType = "subassembly"; boomSub.cost.process = "purchased";
  Object.assign(boomSub.dfa, {separateForService:true,

    size:"large", sym:"oneWay", dir:"side", fix:"screw", fixCount:4});
  parts.splice(parts.indexOf(byName("Boom, CFRP tube")), 0, boomSub);
  ["Boom, CFRP tube","VTOL motor mount","VTOL motor","ESC to motor harness"]
    .forEach(n=>{ const p=byName(n); if(p) p.parent = boomSub.id; });

  const lube = samplePart();

   ============================================================ */
const LSKEY = "assembly-cost-workbench-v1";
let S = null;
let ui = { tab:"setup", selPart:null, libTab:"rates" };

function uid(){ return "p"+Math.random().toString(36).slice(2,9); }

function load(){
  try{
    const raw = localStorage.getItem(LSKEY);
    if(raw){ const o = JSON.parse(raw); if(o && (o.parts || o.variants)){ return migrate(o); } }
  }catch(e){ /* storage blocked or corrupt - fall through to sample */ }
  return sampleProject();
}
/* S.parts is a live reference into the active variant, so writing both would
   store every part twice. The variants are the record; S.parts is rebuilt from
   them on load. */
function projectJson(indent){
  const out = {};
  for(const k in S) if(k!=="parts") out[k] = S[k];
  return JSON.stringify(out, null, indent||0);
}
function save(){
  try{ localStorage.setItem(LSKEY, projectJson()); }catch(e){ /* non-fatal */ }
}
function migrate(o){
  // fill in any library keys added after the file was saved
  o.lib = deepDefault(o.lib||{}, DEFAULT_LIB);
  o.settings = o.settings||{basis:"vendor"};
  if(!o.settings.importMode) o.settings.importMode = "replace";

  /* Files written before design options existed hold a single flat part list.
     Wrap it as the first variant; from here on the variant owns the array and
     S.parts is a live reference to it, never a copy. */
  if(!Array.isArray(o.variants) || !o.variants.length){
    o.variants = [{id:"v1", name:"Original design", note:"", parts:o.parts||[]}];
    o.active = "v1";
  }
  o.variants.forEach((v,i)=>{
    v.id = v.id || ("v"+(i+1));
    v.name = v.name || ("Option "+i);
    if(!Array.isArray(v.parts)) v.parts = [];
    v.parts.forEach(normalisePart);
  });
  if(!o.variants.some(v=>v.id===o.active)) o.active = o.variants[0].id;
  o.parts = o.variants.find(v=>v.id===o.active).parts;
  o.schema = 2;
  return o;
}
/* Fill in fields added after a file was written, without disturbing the ones
   already there. */
function normalisePart(pt){
  const base = samplePart();
  pt.dfa  = deepDefault(pt.dfa||{},  base.dfa);
  pt.cost = deepDefault(pt.cost||{}, base.cost);
  pt.op   = deepDefault(pt.op||{},   base.op);
  pt.service = deepDefault(pt.service||{}, base.service);
  if(!pt.itemType) pt.itemType = "part";
  if(pt.parent===undefined) pt.parent = "";
  return pt;
}

/* ---- Design options (variants) ----------------------------------------
   A DFMA study is a comparison: the design as it stands, then options that
   change materials, processes or the assembly itself. Each option is a full
   copy of the part list, analysed by the same engine, so any two can be put
   side by side. S.parts always points at the active option's array. */
function variant(id){ return S.variants.find(v=>v.id===(id||S.active)) || S.variants[0]; }
function setParts(arr){ variant().parts = arr; S.parts = arr; }
function useVariant(id){
  const v = S.variants.find(x=>x.id===id); if(!v) return;
  S.active = id; S.parts = v.parts; ui.selPart = null;
}
function addVariant(fromId, name, note){
  const src = S.variants.find(v=>v.id===fromId);
  const copy = JSON.parse(JSON.stringify(src ? src.parts : []));
  /* New ids, but the parent links must follow the copy, not the original. */
  const remap = {};
  copy.forEach(p=>{ const old=p.id; p.id=uid(); remap[old]=p.id; });
  copy.forEach(p=>{ if(p.parent && remap[p.parent]) p.parent = remap[p.parent]; });
  const v = {id:"v"+Math.random().toString(36).slice(2,7), name:name||"New option", note:note||"", parts:copy};
  S.variants.push(v);
  return v;
}
/* Run an analysis function against another option without disturbing the
   active one. Everything downstream reads S.parts, so this is the seam. */
function withVariant(v, fn){
  const keep = S.parts, keepActive = S.active;
  S.parts = v.parts; S.active = v.id;
  try { return fn(); } finally { S.parts = keep; S.active = keepActive; }
}
/* Add an item to the structure. If a sub-assembly is selected it goes inside
   it; if a part inside one is selected it joins that sub-assembly, which is
   what you nearly always mean. */
function addItem(pt){
  S.meta.sample = false;
  const sel = S.parts.find(x=>x.id===ui.selPart);
  if(sel) pt.parent = sel.itemType==="subassembly" ? sel.id : sel.parent;
  S.parts.push(pt);
  ui.selPart = pt.id;
  save(); render();
}

function variantSummary(v){
  return withVariant(v, ()=>{
    const c = costProduct();
    return { id:v.id, name:v.name, note:v.note,
      parts:c.dfa.nTotal, ess:c.dfa.nEss, designEff:c.dfa.designEff,
      sec:c.dfa.totalSec, eff:c.dfa.efficiency, massG:c.massG,
      partsCost:c.partsTotal, labour:c.assemblyLabour, total:c.total,
      service:c.svc.lifetimeCost, ops:c.dfa.nOps };
  });
}
function deepDefault(target, defaults){
  if(Array.isArray(defaults)) return (target && target.length!==undefined) ? target : JSON.parse(JSON.stringify(defaults));
  if(typeof defaults!=="object"||defaults===null) return target===undefined?defaults:target;
  const out = (typeof target==="object"&&target!==null)?target:{};
  for(const k in defaults) out[k] = deepDefault(out[k], defaults[k]);
  return out;
}

/* ============================================================
   4. DFA ENGINE
   ============================================================ */
/* The seven Boothroyd-style minimum-part-count categories. The first four sit
   above the line: a part in one of them earns its place and must not be
   consolidated away. The last three sit below it and are always candidates. */
const MIN_PART_CATS = {
  base:     {label:"Base part — the platform everything else is built on", essential:true},
  movement: {label:"Movement — must move relative to the parts beneath it", essential:true},
  material: {label:"Material — must be a different material, or isolated",  essential:true},
  assembly: {label:"Assembly / service — must be separate for access",      essential:true},
  fastener: {label:"Fastener — screw, nut, rivet, tie",                     essential:false},
  connector:{label:"Connector — joins parts, no function of its own",       essential:false},
  other:    {label:"Other — no separating reason found",                    essential:false}
};
/* Which category a part falls into, from the answers already recorded. The
   three yes/no tests stay the source of truth; the category is how the result
   reads in a report. */
function minPartCat(pt){
  const d = pt.dfa;
  if(d.isBase) return "base";
  if(d.moveRelative) return "movement";
  if(d.differentMaterial) return "material";
  if(d.separateForService) return "assembly";
  const b = d.bCat;
  return (b==="fastener"||b==="connector") ? b : "other";
}

function dfaPart(pt){
  const T = S.lib.dfa, d = pt.dfa;

  /* An operation is not a part: it has no handling or fitting index and never
     counts towards the part count, but its time is real assembly time. */
  if(pt.itemType==="operation"){
    const sec = Math.max(0, num(pt.op && pt.op.sec, 0));
    const n   = Math.max(0, num(pt.qty,1));
    return { isOp:true, essential:true, cat:"operation", qty:n,
      handlingIndex:0, fittingIndex:0, partIndex:0,
      handlingSec:0, fittingSec:r2(sec), unitSec:r2(sec), totalSec:r2(sec*n),
      hUsed:[], fUsed:[], overHandling:false, overFitting:false };
  }

  const size = T.hSize[d.size]||T.hSize.normal;
  const sym  = T.hSym[d.sym]||T.hSym.oneWay;

  let hIdx = size.idx + sym.idx, hSec = size.sec + sym.sec;
  const hUsed = [];
  for(const k in T.hFlags){ if(d.hFlags && d.hFlags[k]){ hIdx += T.hFlags[k].idx; hSec += T.hFlags[k].sec; hUsed.push(T.hFlags[k].label); } }

  const dir = T.fDir[d.dir]||T.fDir.topDown;
  let fIdx = T.fBase.idx + dir.idx, fSec = T.fBase.sec + dir.sec;
  const fUsed = [];
  for(const k in T.fFlags){ if(d.fFlags && d.fFlags[k]){ fIdx += T.fFlags[k].idx; fSec += T.fFlags[k].sec; fUsed.push(T.fFlags[k].label); } }

  const fix = T.fFix[d.fix]||T.fFix.none;
  const nFix = Math.max(1, num(d.fixCount,1));
  fIdx += fix.idx;
  fSec += fix.sec * (d.fix==="none" ? 0 : nFix);
  if(d.fix!=="none") fUsed.push(nFix+"× "+fix.label);

  const cat = minPartCat(pt);
  const essential = MIN_PART_CATS[cat].essential;
  const qty = Math.max(0, num(pt.qty,1));

  return {
    isOp:false, cat, essential, qty,
    handlingIndex:r2(hIdx), fittingIndex:r2(fIdx), partIndex:r2(hIdx+fIdx),
    handlingSec:r2(hSec), fittingSec:r2(fSec), unitSec:r2(hSec+fSec),
    totalSec:r2((hSec+fSec)*qty),
    hUsed, fUsed,
    overHandling: hIdx > T.targets.handling,
    overFitting:  fIdx > T.targets.fitting
  };
}

function dfaProduct(){
  const rows = S.parts.map(pt=>({pt, r:dfaPart(pt)}));
  let nTotal=0, nEss=0, totalSec=0, sumH=0, sumF=0, opSec=0, nOps=0, nSub=0;
  rows.forEach(({pt,r})=>{
    totalSec += r.totalSec;
    if(r.isOp){ opSec += r.totalSec; nOps += r.qty; return; }
    if(pt.itemType==="subassembly") nSub += 1;
    nTotal += r.qty;
    if(r.essential) nEss += r.qty;
    sumH += r.handlingIndex * r.qty;
    sumF += r.fittingIndex * r.qty;
  });
  const ideal = num(S.lib.rates.idealAssemblySec, 3);
  const designEff = nTotal ? (nEss/nTotal)*100 : 0;
  const efficiency = totalSec>0 ? (nEss*ideal/totalSec)*100 : 0;
  const denom = nEss || 1;
  const labourCost = (totalSec/3600) * num(S.lib.rates.assemblyLabourPerHour,0);

  // field deployment: only the parts the operator fits in the field
  let fieldSec = 0, fieldParts = 0, fieldToolParts = 0;
  rows.forEach(({pt,r})=>{
    if(pt.fieldAssembly){
      fieldSec += r.totalSec; fieldParts += r.qty;
      if(!pt.toolFree) fieldToolParts += r.qty;
    }
  });

  return {
    rows, nTotal, nEss, nRedundant:nTotal-nEss,
    totalSec:r2(totalSec), totalMin:r2(totalSec/60),
    designEff:r1(designEff), efficiency:r1(efficiency),
    feedingRatio:r2(sumH/denom), fittingRatio:r2(sumF/denom),
    labourCost, opSec:r2(opSec), nOps, nSub,
    fieldSec:r2(fieldSec), fieldMin:r2(fieldSec/60), fieldParts, fieldToolParts
  };
}

/* ============================================================
   5. COST ENGINE
   ============================================================ */
function mat(id){ return S.lib.materials.find(m=>m.id===id) || S.lib.materials[0]; }
function mach(id){ return S.lib.machines.find(m=>m.id===id) || S.lib.machines[0]; }
function num(v,d){ const n = typeof v==="number"?v:parseFloat(v); return isFinite(n)?n:(d||0); }
function r1(n){ return Math.round(n*10)/10 } function r2(n){ return Math.round(n*100)/100 }

function bboxArea(x,y,z){ return 2*(x*y + y*z + x*z); }

/* ---- 5a. CNC machining / drilling ---- */
function costMachining(pt){
  const c = pt.cost.machining, m = mat(c.materialId), k = mach(c.machineId), K = S.lib.cost.machining;
  const stockVol = c.stockForm==="bar"
      ? Math.PI/4*Math.pow(num(c.D),2)*num(c.L)
      : num(c.L)*num(c.W)*num(c.H);
  const partVol = Math.min(num(c.partVolume), stockVol||num(c.partVolume));
  const removedVol = Math.max(0, stockVol - partVol);

  const stockMassKg = stockVol/1e6 * m.density / 1000 * 1000; // mm3 -> cm3 -> g -> kg
  const stockKg = stockVol/1000 * m.density / 1000;
  const removedKg = removedVol/1000 * m.density / 1000;

  // roughing by material removal rate
  const roughMin = num(m.mrr,10000)>0 ? removedVol/num(m.mrr,10000) : 0;

  // drilling, hole group by hole group
  let drillMin = 0, holeCount = 0;
  (c.holes||[]).forEach(h=>{
    const n = Math.max(0,num(h.count)), d = num(h.dia), dep = num(h.depth);
    if(!n || d<=0) return;
    holeCount += n;
    const rpm = Math.min(num(k.maxRpm,6000), 1000*num(m.vc,100)/(Math.PI*d));
    const feedMmPerMin = Math.max(1, num(m.fpr,0.1)*rpm);
    const perHole = (dep + K.approachMm) / feedMmPerMin * (dep > 3*d ? K.peckFactor : 1);
    drillMin += n * (perHole + num(k.rapidSec,2)/60);
  });

  // finishing pass over the finished surface
  const area = num(c.surfaceArea) > 0 ? num(c.surfaceArea)
             : (c.stockForm==="bar" ? Math.PI*num(c.D)*num(c.L) : bboxArea(num(c.L),num(c.W),num(c.H)));
  const finishMin = K.finishRateMm2PerMin>0 ? area/K.finishRateMm2PerMin : 0;

  const tolMult = (S.lib.cost.tolerance[c.tolerance]||{mult:1}).mult;
  const finMult = (S.lib.cost.finish[c.finish]||{mult:1}).mult;
  const cutMin = (roughMin + drillMin + finishMin) * tolMult * finMult;

  const nonCutMin = num(c.toolChanges)*num(k.toolChangeSec,8)/60
                  + K.loadUnloadSec/60 + K.inspectionSec/60;
  const batch = Math.max(1, num(c.batchSize,1));
  const setupPerPart = num(c.setupMin) * Math.max(1,num(c.setups,1)) / batch;
  const cycleMin = cutMin + nonCutMin + setupPerPart;

  const machineCost = cycleMin/60 * num(k.ratePerHour);
  const labourCost  = cycleMin/60 * num(S.lib.rates.labourPerHour) * (K.operatorAttendPct/100);
  const materialCost = stockKg * num(m.pricePerKg)
      - (c.scrapCredit ? removedKg * num(m.scrapPerKg,0) : 0);

  return {
    massG: partVol/1000 * m.density,
    lines:[
      {k:"Stock material", v:stockKg*num(m.pricePerKg), d:r2(stockKg)+" kg @ "+CUR+num(m.pricePerKg)+"/kg"},
      {k:"Scrap credit", v:-(c.scrapCredit?removedKg*num(m.scrapPerKg,0):0), d:c.scrapCredit? r2(removedKg)+" kg recovered":"not claimed"},
      {k:"Machine time", v:machineCost, d:r2(cycleMin)+" min @ "+CUR+num(k.ratePerHour)+"/hr"},
      {k:"Direct labour", v:labourCost, d:K.operatorAttendPct+"% attendance"}
    ],
    conversion: machineCost+labourCost,
    material: materialCost,
    detail:[
      ["Stock volume", r2(stockVol)+" mm³"],
      ["Material removed", r2(removedVol)+" mm³ ("+(stockVol? r1(removedVol/stockVol*100):0)+"%)"],
      ["Roughing", r2(roughMin)+" min @ MRR "+num(m.mrr)+" mm³/min"],
      ["Drilling", r2(drillMin)+" min, "+holeCount+" holes"],
      ["Finishing", r2(finishMin)+" min over "+r2(area)+" mm²"],
      ["Tolerance / finish uplift", "×"+r2(tolMult*finMult)],
      ["Non-cutting", r2(nonCutMin)+" min"],
      ["Setup amortised", r2(setupPerPart)+" min ("+num(c.setupMin)+" min / batch "+batch+")"],
      ["Cycle time", r2(cycleMin)+" min"]
    ]
  };
}

/* ---- 5b. FDM ---- */
function costFdm(pt){
  const c = pt.cost.fdm, m = mat(c.materialId), k = mach(c.machineId), K = S.lib.cost.fdm;
  const area = num(c.surfaceArea)>0 ? num(c.surfaceArea) : bboxArea(num(c.bx),num(c.by),num(c.bz));
  const partVol = num(c.partVolume);
  const extrWidth = num(c.nozzle,0.4)*K.extrusionWidthFactor;

  // shell volume from surface area x wall count x extrusion width (capped at part volume)
  const shellVol = Math.min(partVol, area * Math.max(1,num(c.walls,2)) * extrWidth);
  const infillVol = Math.max(0, partVol - shellVol) * (num(c.infillPct,20)/100);
  const supportVol = partVol * (num(c.supportPct,0)/100);
  const extrudedVol = shellVol + infillVol + supportVol;

  const flow = num(c.layerHeight,0.2) * extrWidth * num(k.printSpeed,60) * num(k.flowEff,0.85); // mm3/s
  const layers = num(c.layerHeight,0.2)>0 ? Math.ceil(num(c.bz)/num(c.layerHeight,0.2)) : 0;
  const printSec = (flow>0 ? extrudedVol/flow : 0) + layers*num(k.layerOverheadSec,1);
  const perPlate = Math.max(1, num(c.partsPerPlate,1));
  const machineMin = printSec/60 + num(k.warmupMin,0)/perPlate;

  const massG = extrudedVol/1000 * m.density * (1 + K.wastePct/100);
  const materialCost = massG/1000 * num(m.pricePerKg);
  const machineCost = machineMin/60 * num(k.ratePerHour);
  const labourMin = num(k.plateSetupMin,5)/perPlate + K.postProcessMin;
  const labourCost = labourMin/60 * num(S.lib.rates.labourPerHour);
  const failUplift = (machineCost+materialCost+labourCost) * (K.failurePct/100);

  return {
    massG: (shellVol + infillVol)/1000 * m.density,
    lines:[
      {k:"Filament", v:materialCost, d:r2(massG)+" g @ "+CUR+num(m.pricePerKg)+"/kg"},
      {k:"Machine time", v:machineCost, d:r2(machineMin)+" min @ "+CUR+num(k.ratePerHour)+"/hr"},
      {k:"Labour (setup + support removal)", v:labourCost, d:r2(labourMin)+" min"},
      {k:"Failure allowance", v:failUplift, d:K.failurePct+"% of the above"}
    ],
    conversion: machineCost+labourCost+failUplift,
    material: materialCost,
    detail:[
      ["Shell volume", r2(shellVol)+" mm³ ("+Math.max(1,num(c.walls))+" walls × "+r2(extrWidth)+" mm)"],
      ["Infill volume", r2(infillVol)+" mm³ @ "+num(c.infillPct)+"%"],
      ["Support volume", r2(supportVol)+" mm³ @ "+num(c.supportPct)+"%"],
      ["Extruded volume", r2(extrudedVol)+" mm³"],
      ["Volumetric flow", r2(flow)+" mm³/s"],
      ["Layers", layers+" @ "+num(c.layerHeight)+" mm"],
      ["Print time", r2(printSec/60)+" min"],
      ["Parts per plate", perPlate]
    ]
  };
}

/* ---- 5c. SLS / MJF powder bed ---- */
function costPowder(pt){
  const c = pt.cost.powder, m = mat(c.materialId), k = mach(c.machineId), K = S.lib.cost.powder;
  const buildVol = num(k.buildX,300)*num(k.buildY,300)*num(k.buildZ,300);
  const bboxVol = num(c.bx)*num(c.by)*num(c.bz);
  const packing = (num(c.packingOverride)>0 ? num(c.packingOverride) : K.packingDensityPct)/100;

  const autoPerBuild = bboxVol>0 ? Math.floor(buildVol*packing/bboxVol) : 0;
  const perBuild = Math.max(1, num(c.partsPerBuild)>0 ? num(c.partsPerBuild) : autoPerBuild);

  const layers = num(k.layerHeight,0.1)>0 ? Math.ceil(num(k.buildZ,300)/num(k.layerHeight,0.1)) : 0;
  const buildHr = (layers*num(k.layerTimeSec,20))/3600 + num(k.warmupMin,0)/60 + num(k.cooldownMin,0)/60;
  const machinePerBuild = buildHr * num(k.ratePerHour);

  // powder: parts consume solid powder; the surrounding cake is partly recycled
  const partsMassKg = perBuild * num(c.partVolume)/1000 * m.density / 1000;
  const bulk = num(m.bulkDensity, m.density*0.45);
  const cakeMassKg = Math.max(0, (buildVol - perBuild*num(c.partVolume))/1000 * bulk / 1000);
  const virginKg = partsMassKg + cakeMassKg*(1 - K.recyclePct/100);
  const powderPerBuild = virginKg * num(m.pricePerKg);

  const machineCost = machinePerBuild/perBuild;
  const materialCost = powderPerBuild/perBuild;
  const labourMin = K.depowderMinPerPart + K.postProcessMinPerPart;
  const labourCost = labourMin/60 * num(S.lib.rates.labourPerHour);

  return {
    massG: num(c.partVolume)/1000 * m.density,
    lines:[
      {k:"Powder", v:materialCost, d:r2(virginKg)+" kg virgin per build ÷ "+perBuild+" parts"},
      {k:"Machine time", v:machineCost, d:r2(buildHr)+" hr build ÷ "+perBuild+" parts"},
      {k:"Labour (depowder + finish)", v:labourCost, d:r2(labourMin)+" min/part"}
    ],
    conversion: machineCost+labourCost,
    material: materialCost,
    detail:[
      ["Build volume", r2(buildVol/1000)+" cm³"],
      ["Packing density", r1(packing*100)+"%"],
      ["Parts per build", perBuild + (num(c.partsPerBuild)>0?" (manual)":" (auto, from bounding box)")],
      ["Layers", layers+" @ "+num(k.layerHeight)+" mm"],
      ["Build time", r2(buildHr)+" hr incl. warm-up + cool-down"],
      ["Cake powder", r2(cakeMassKg)+" kg, "+K.recyclePct+"% recycled"],
      ["Virgin powder per build", r2(virginKg)+" kg"]
    ]
  };
}

/* ---- 5d. wire harness ---- */
function costHarness(pt){
  const c = pt.cost.harness, w = mat(c.wireId), k = mach(c.machineId||"bench"), K = S.lib.harness;
  const lenM = num(c.lengthMm)/1000;
  const cores = Math.max(1, num(c.cores,1));
  const branches = Math.max(1, num(c.branches,1));

  const wireM = lenM * cores * (1 + K.wireWastePct/100);
  const wireCost = wireM * num(w.pricePerM);

  const contacts = num(c.contactsOverride)>0 ? num(c.contactsOverride)
                 : num(c.connAPins) + num(c.connBPins) + num(c.splices)*2;
  const connectors = (num(c.connAPins)>0?1:0) + (num(c.connBPins)>0?1:0);
  const connCost = num(c.connAPrice) + num(c.connBPrice) + contacts*K.contactPriceEach;

  const sleevM = num(c.sleevingMm)/1000;
  const consumables = sleevM*K.sleevingPricePerM
                    + num(c.heatshrink)*K.heatshrinkPriceEach
                    + num(c.labels)*K.labelPriceEach
                    + num(c.ties)*K.tiePriceEach;

  const testMin = num(c.testMin)>0 ? num(c.testMin) : K.continuityTestMin;
  const buildSec = cores*2*K.cutStripSecPerEnd
                 + contacts*K.crimpSecPerContact
                 + connectors*K.connectorAssySec
                 + sleevM*K.sleevingSecPerM
                 + num(c.heatshrink)*K.heatshrinkSecEach
                 + num(c.labels)*K.labelSecEach
                 + num(c.ties)*K.tieSecEach
                 + (branches-1)*K.connectorAssySec*0.5;
  const buildMin = buildSec/60 + testMin;
  const labourCost = buildMin/60 * num(S.lib.rates.labourPerHour);
  const benchCost = buildMin/60 * num(k.ratePerHour);

  const massG = lenM*cores*num(w.gramsPerM) + connectors*K.connectorGramsEach
              + num(c.heatshrink)*0.4 + num(c.ties)*0.8;

  return {
    massG,
    lines:[
      {k:"Wire", v:wireCost, d:r2(wireM)+" m of "+w.name+" incl. "+K.wireWastePct+"% waste"},
      {k:"Connectors + contacts", v:connCost, d:connectors+" connector"+(connectors===1?"":"s")+", "+contacts+" contacts"},
      {k:"Sleeving, heatshrink, labels, ties", v:consumables, d:r2(sleevM)+" m sleeving, "+num(c.heatshrink)+" HS, "+num(c.labels)+" labels, "+num(c.ties)+" ties"},
      {k:"Build labour", v:labourCost, d:r2(buildMin)+" min incl. "+r2(testMin)+" min continuity test"},
      {k:"Bench time", v:benchCost, d:r2(buildMin)+" min @ "+CUR+num(k.ratePerHour)+"/hr"}
    ],
    conversion: labourCost + benchCost,
    material: wireCost + connCost + consumables,
    detail:[
      ["Route length", num(c.lengthMm)+" mm × "+cores+" cores"],
      ["Branches", branches],
      ["Cut and strip", cores*2+" ends @ "+K.cutStripSecPerEnd+" s"],
      ["Crimping", contacts+" contacts @ "+K.crimpSecPerContact+" s"],
      ["Connector assembly", connectors+" @ "+K.connectorAssySec+" s"],
      ["Build time", r2(buildMin)+" min"],
      ["Harness mass", r2(massG)+" g"]
    ]
  };
}

/* ---- 5e. composite layup ---- */
function costComposite(pt){
  const c = pt.cost.composite, m = mat(c.materialId), k = mach(c.machineId||"oven"), K = S.lib.composite;
  const areaM2 = num(c.areaMm2)/1e6;
  const plies = Math.max(1, num(c.plies,1));

  const fabricKg = areaM2 * plies * num(m.gsm,200)/1000 * (1 + K.fabricWastePct/100);
  const fabricCost = fabricKg * num(m.pricePerKg);
  const resinKg = m.prepreg ? 0 : fabricKg * K.resinRatio;
  const resinCost = resinKg * K.resinPricePerKg;

  let coreKg = 0, coreCost = 0;
  if(c.coreId && num(c.coreThickness)>0){
    const core = mat(c.coreId);
    coreKg = areaM2 * num(c.coreThickness)/1000 * num(core.density,50);
    coreCost = coreKg * num(core.pricePerKg);
  }

  const consumableCost = areaM2 * K.consumablePricePerM2;

  const layupMin = plies * areaM2 * K.layupMinPerPlyPerM2 + K.prepMin
                 + num(c.debulks) * K.debulkMinEach + areaM2 * K.baggingMinPerM2;
  const finishMin = (num(c.trimMin)>0?num(c.trimMin):K.trimFinishMin) + (num(c.ndtMin)>0?num(c.ndtMin):K.ndtMin);
  const labourCost = (layupMin + finishMin)/60 * num(S.lib.rates.labourPerHour);

  const perCure = Math.max(1, num(c.partsPerCure,1));
  const cureCost = num(c.cureHr) * num(k.ratePerHour) / perCure;

  const toolLife = Math.max(1, num(c.toolLife,1));
  const toolingCost = num(c.toolCost) / toolLife;

  const direct = fabricCost + resinCost + coreCost + consumableCost + labourCost + cureCost + toolingCost;
  const scrapUplift = direct * K.scrapPct/100;

  const massG = (fabricKg/(1 + K.fabricWastePct/100) + resinKg + coreKg) * 1000;

  return {
    massG,
    lines:[
      {k:"Fabric", v:fabricCost, d:r2(fabricKg)+" kg, "+plies+" plies of "+num(m.gsm)+" gsm over "+r2(areaM2)+" m²"},
      {k:"Resin", v:resinCost, d:m.prepreg? "included in prepreg" : r2(resinKg)+" kg at "+K.resinRatio+" ratio"},
      {k:"Core", v:coreCost, d:coreKg? r2(coreKg)+" kg" : "none"},
      {k:"Bagging consumables", v:consumableCost, d:r2(areaM2)+" m² @ "+CUR+K.consumablePricePerM2+"/m²"},
      {k:"Layup + finishing labour", v:labourCost, d:r2(layupMin+finishMin)+" min"},
      {k:"Cure", v:cureCost, d:num(c.cureHr)+" hr on "+k.name+" ÷ "+perCure+" parts"},
      {k:"Tooling amortised", v:toolingCost, d:CUR+fmt0(num(c.toolCost))+" mould ÷ "+toolLife+" parts"},
      {k:"Scrap allowance", v:scrapUplift, d:K.scrapPct+"% – composites scrap high"}
    ],
    conversion: labourCost + cureCost + toolingCost + scrapUplift,
    material: fabricCost + resinCost + coreCost + consumableCost,
    detail:[
      ["Laminate area", r2(areaM2)+" m²"],
      ["Ply count", plies + (m.prepreg? " (prepreg)" : " (wet layup)")],
      ["Layup labour", r2(layupMin)+" min incl. "+num(c.debulks)+" debulk(s)"],
      ["Trim + NDT", r2(finishMin)+" min"],
      ["Cure cycle", num(c.cureHr)+" hr, "+perCure+" parts per cycle"],
      ["Cured mass", r2(massG)+" g"]
    ]
  };
}

/* ---- 5f. foam ---- */
function costFoam(pt){
  const c = pt.cost.foam, m = mat(c.materialId), k = mach(c.machineId||"foamCnc"), K = S.lib.foamProc;
  const partVol = num(c.partVolume);
  const partKg = partVol/1e9 * num(m.density,60);      // mm3 -> m3 -> kg
  let materialCost, machineMin, toolingCost = 0, detail = [];

  if(c.method === "moulded"){
    const cav = Math.max(1, num(c.cavities,1));
    const cycleSec = num(c.cycleSec)>0 ? num(c.cycleSec) : num(k.cycleSec,180);
    materialCost = partKg * num(m.pricePerKg) * (1 + K.wastePct/100);
    machineMin = (cycleSec/60) / cav;
    const toolLife = Math.max(1, num(c.toolLife,1));
    toolingCost = num(c.toolCost)/toolLife;
    detail = [
      ["Method","Bead moulding"],
      ["Cycle", cycleSec+" s ÷ "+cav+" cavities"],
      ["Tooling", CUR+fmt0(num(c.toolCost))+" ÷ "+toolLife+" parts"]
    ];
  } else {
    const mar = K.blockMarginMm;
    const blockVol = (num(c.bx)+2*mar)*(num(c.by)+2*mar)*(num(c.bz)+2*mar);
    const blockKg = blockVol/1e9 * num(m.density,35);
    materialCost = blockKg * num(m.pricePerKg);
    machineMin = num(k.mrr,900000)>0 ? Math.max(0, blockVol - partVol)/num(k.mrr,900000) : 0;
    detail = [
      ["Method","CNC / hot-wire from block"],
      ["Block", r2(blockVol/1000)+" cm³ with "+mar+" mm margin"],
      ["Removed", r2((blockVol-partVol)/1000)+" cm³ @ "+num(k.mrr)+" mm³/min"],
      ["Yield", blockKg>0? r1(partKg/blockKg*100)+"% of the block ends up in the part" : "-"]
    ];
  }

  const machineCost = machineMin/60 * num(k.ratePerHour);
  const labourMin = K.trimMin;
  const labourCost = labourMin/60 * num(S.lib.rates.labourPerHour);

  return {
    massG: partKg*1000,
    lines:[
      {k:"Foam", v:materialCost, d:r2(partKg*1000)+" g at "+num(m.density)+" kg/m³"},
      {k:"Machine time", v:machineCost, d:r2(machineMin)+" min @ "+CUR+num(k.ratePerHour)+"/hr"},
      {k:"Tooling amortised", v:toolingCost, d:toolingCost? "per part" : "none"},
      {k:"Trim labour", v:labourCost, d:labourMin+" min"}
    ],
    conversion: machineCost + labourCost + toolingCost,
    material: materialCost,
    detail: detail.concat([["Part mass", r2(partKg*1000)+" g"]])
  };
}

/* ============================================================
   5g. SERVICEABILITY
   What it costs to take the thing apart again. A permanent joint on a
   part that has to come out is the defect this exists to surface.
   ============================================================ */
const PERMANENT_FIX = ["solder","weld","adhesive","rivet","lockwire"];

function servicePart(pt, unitCost){
  const K = S.lib.service, sv = pt.service || {}, r = dfaPart(pt);
  const cls = sv.cls || "none";
  const solder = Math.max(0, num(sv.solderJoints));
  const depth  = Math.max(0, num(sv.accessDepth));
  const removals = Math.max(0, num(sv.removalsPerLife));

  const permanent = PERMANENT_FIX.indexOf(pt.dfa.fix) >= 0;
  const destructive = !!sv.destructive || (permanent && pt.dfa.fix !== "lockwire");

  const accessSec  = depth * K.accessPartSec;
  const removeSec  = r.fittingSec * K.removeFactor + solder * K.desolderSecPerJoint;
  const refitSec   = r.fittingSec * K.refitFactor + r.handlingSec + solder * K.desolderSecPerJoint;
  const overheadSec= (K.diagnosisMin + K.testAfterMin + num(sv.reworkMin)) * 60;
  const eventSec   = accessSec*2 + removeSec + refitSec + overheadSec;

  const labourCost = eventSec/3600 * num(S.lib.rates.labourPerHour);
  const scrapCost  = destructive ? num(unitCost) : 0;
  // Repeated reflow on the same pads carries a real chance of writing off the
  // board. On an expensive assembly this dominates the labour, which is why a
  // labour-only payback figure understates the case for a connector.
  const riskPct    = num(sv.damageRiskPct, S.lib.service.solderDamageRiskPct);
  const riskCost   = solder>0 ? num(unitCost) * riskPct/100 : 0;
  const eventCost  = labourCost + scrapCost + riskCost;

  // what connectorising the soldered joints would trade
  const connCost   = solder * K.connectorCostPerJoint;
  const connGrams  = solder * K.connectorGramsPerJoint;
  const savedSec   = solder * (K.desolderSecPerJoint*2 - K.connectorMateSec);

  return {
    cls, solder, depth, removals, permanent, destructive,
    eventSec:r2(eventSec), eventMin:r2(eventSec/60),
    eventCost, lifetimeCost: eventCost*removals, lifetimeSec: eventSec*removals,
    connCost, connGrams, savedSec:r2(savedSec),
    labourCost, riskCost, riskPct,
    savedPerRemoval: savedSec/3600*num(S.lib.rates.labourPerHour) + riskCost,
    breakeven: savedSec>0 ? Math.ceil(connCost / Math.max(0.01, savedSec/3600*num(S.lib.rates.labourPerHour) + riskCost)) : 0,
    serviceable: cls==="field" || cls==="depot"
  };
}

function costPart(pt){
  /* An operation carries only its consumable cost — grease, solder, adhesive.
     Its labour is already counted as assembly time, so it is not added twice. */
  if(pt.itemType==="operation"){
    const c = Math.max(0, num(pt.op && pt.op.cost, 0));
    const n = Math.max(0, num(pt.qty,1));
    const o = { lines:[{k:"Consumable", v:c, d:"per operation"}], conversion:0, material:c,
      detail:[["Source","Assembly operation — labour counted as assembly time"]],
      basis:"inhouse", direct:c, scrap:0, overhead:0, margin:0, freight:0,
      massG:0, massSource:"entered", massExtended:0, unit:c, extended:c*n };
    o.service = servicePart(pt, c);
    return o;
  }
  const proc = pt.cost.process;
  let base;
  if(proc==="machining") base = costMachining(pt);
  else if(proc==="fdm")  base = costFdm(pt);
  else if(proc==="powder") base = costPowder(pt);
  else if(proc==="harness") base = costHarness(pt);
  else if(proc==="composite") base = costComposite(pt);
  else if(proc==="foam") base = costFoam(pt);
  else base = { lines:[{k:"Purchase price", v:num(pt.cost.purchasedPrice), d:"as quoted"}],
                conversion:0, material:num(pt.cost.purchasedPrice),
                detail:[["Source","Purchased / catalogue item"]] };

  const R = S.lib.rates;
  const basis = pt.cost.basis==="inherit" ? S.settings.basis : pt.cost.basis;
  const direct = base.conversion + base.material;
  let scrap=0, overhead=0, margin=0, freight=0;
  if(proc!=="purchased" && basis==="vendor"){
    scrap    = direct * R.scrapPct/100;
    overhead = base.conversion * R.overheadPct/100;
    const sub = direct + scrap + overhead;
    margin   = sub * R.marginPct/100;
    freight  = sub * R.packFreightPct/100;
  }
  const unit = direct + scrap + overhead + margin + freight;
  const qty = Math.max(0,num(pt.qty,1));
  const massG = num(pt.massG)>0 ? num(pt.massG) : num(base.massG,0);
  base.service = servicePart(pt, unit);
  return Object.assign(base, {
    basis, direct, scrap, overhead, margin, freight, massG,
    massSource: num(pt.massG)>0 ? "entered" : (massG>0 ? "calculated" : "unknown"),
    massExtended: massG*qty,
    unit, extended: unit * qty
  });
}

function costProduct(){
  const rows = S.parts.map(pt=>({pt, c:costPart(pt)}));
  const partsTotal = rows.reduce((a,x)=>a+x.c.extended,0);
  const massG = rows.reduce((a,x)=>a+x.c.massExtended,0);
  const unknownMass = rows.filter(x=>x.c.massSource==="unknown").length;
  const d = dfaProduct();
  const svc = {
    lifetimeCost: rows.reduce((a,x)=>a+x.c.service.lifetimeCost,0),
    solderJoints: rows.reduce((a,x)=>a+x.c.service.solder*Math.max(1,num(x.pt.qty,1)),0),
    trapped: rows.filter(x=>x.c.service.serviceable && (x.c.service.permanent || x.c.service.solder>0)),
    worst: rows.filter(x=>x.c.service.serviceable).sort((a,b)=>b.c.service.eventSec-a.c.service.eventSec)[0] || null,
    serviceable: rows.filter(x=>x.c.service.serviceable).length
  };
  return { rows, partsTotal, massG, unknownMass,
           assemblyLabour:d.labourCost, total:partsTotal + d.labourCost, dfa:d,
           modules: moduleRollup(rows), domains: domainRollup(rows), svc };
}

/* Mechanical, electrical, wiring and the interface between them. The
   electromechanical parts are where most integration problems live, so they
   are worth being able to see on their own. */
const DOMAINS = {
  mech:"Mechanical", elec:"Electrical / electronic",
  electromech:"Electromechanical interface", wiring:"Wiring / harness"
};
function domainRollup(rows){
  const map = new Map();
  Object.keys(DOMAINS).forEach(k=>map.set(k,{key:k, name:DOMAINS[k], parts:0, ess:0, ops:0, cost:0, massG:0, sec:0, svcCost:0, solder:0}));
  rows.forEach(({pt,c})=>{
    const g = map.get(pt.domain) || map.get("mech");
    const r = dfaPart(pt);
    /* Operations carry time and consumable cost but are not parts, so they
       must not reach the part count or the design efficiency here either. */
    if(!r.isOp){ g.parts += r.qty; if(r.essential) g.ess += r.qty; }
    else g.ops += r.qty;
    g.cost += c.extended; g.massG += c.massExtended; g.sec += r.totalSec;
    g.svcCost += c.service.lifetimeCost; g.solder += c.service.solder*r.qty;
  });
  return Array.from(map.values()).filter(g=>g.parts>0 || g.ops>0)
    .map(g=>Object.assign(g,{designEff: g.parts? r1(g.ess/g.parts*100):0}));
}

/* Per-module rollup. A drone BOM is only legible module by module -
   wing, boom, avionics bay, payload - so every result is available that way. */
function moduleRollup(rows){
  const map = new Map();
  rows.forEach(({pt,c})=>{
    const key = (pt.module||"").trim() || "Unassigned";
    if(!map.has(key)) map.set(key, {name:key, parts:0, ess:0, ops:0, cost:0, massG:0, sec:0, fieldSec:0});
    const g = map.get(key), r = dfaPart(pt);
    if(!r.isOp){ g.parts += r.qty; if(r.essential) g.ess += r.qty; }
    else g.ops += r.qty;
    g.cost += c.extended;
    g.massG += c.massExtended;
    g.sec += r.totalSec;
    if(pt.fieldAssembly) g.fieldSec += r.totalSec;
  });
  return Array.from(map.values())
    .map(g=>Object.assign(g,{designEff: g.parts? r1(g.ess/g.parts*100):0}))
    .sort((a,b)=>b.cost-a.cost);
}

/* ============================================================
   6. IMPROVEMENT FINDER
   ============================================================ */
/* ---- Input completeness ------------------------------------------------
   A cost model will always return a number. These checks say when that number
   came from the template rather than from the part, because a confident figure
   built on defaults is worse than no figure at all. */
const GEOM_KEYS = {
  machining:["L","W","H","partVolume"], fdm:["bx","by","bz","partVolume"],
  powder:["bx","by","bz","partVolume"], foam:["bx","by","bz","partVolume"],
  composite:["areaMm2","plies"], harness:["lengthMm","cores"]
};
let _geomDefaults = null;
function geomDefaults(){ return _geomDefaults || (_geomDefaults = samplePart().cost); }

function geometryCheck(pt){
  const proc = pt.cost.process, keys = GEOM_KEYS[proc];
  if(!keys || !pt.cost[proc]) return {untouched:false, clamped:false};
  const c = pt.cost[proc], def = geomDefaults()[proc];
  /* Every geometry field still exactly on the shipped default is, in practice,
     a part nobody has measured. It is a heuristic, and it is stated as one. */
  const untouched = keys.every(k=>num(c[k]) === num(def[k]));
  let clamped = false, stockVol = 0;
  if(proc==="machining"){
    stockVol = c.stockForm==="bar" ? Math.PI/4*Math.pow(num(c.D),2)*num(c.L)
                                   : num(c.L)*num(c.W)*num(c.H);
    clamped = stockVol > 0 && num(c.partVolume) > stockVol;
  }
  return {untouched, clamped, stockVol, partVol:num(c.partVolume), keys};
}

function findings(){
  const d = dfaProduct(), cp = costProduct(), out = [];
  const T = S.lib.dfa.targets;

  cp.rows.forEach(({pt,c})=>{
    const r = dfaPart(pt);
    const grams = c.massExtended ? ", "+r1(c.massExtended)+" g" : "";
    if(!r.isOp && !r.essential){
      /* The category says what kind of argument to make. A fastener and a
         bought-in bracket both fail the tests, but they are designed out in
         entirely different ways. */
      const cat = r.cat;
      const title = cat==="fastener"  ? "Separate fastener"
                  : cat==="connector" ? "Connector with no function of its own"
                  :                     "Consolidation candidate";
      const why = cat==="fastener"
        ? "Fasteners are pure assembly cost and dead weight. Design the joint as a snap, press or integral feature and the part, its mass and its fitting time all disappear."
        : cat==="connector"
        ? "It joins two parts but does nothing else. Either the joint becomes an integral feature of one of them, or the two parts become one."
        : "Fails all three minimum-part-count tests — it does not move relative to its neighbours, needs no material separation, and is not required for assembly or service access.";
      out.push({sev:"risk", part:pt.name, title, why,
        gain:"Removing it saves "+CUR+fmt(c.extended)+grams+" and "+r2(r.totalSec)+" s of assembly."});
    }
    const sv = c.service;
    if(sv.serviceable && sv.solder > 0){
      out.unshift({sev:"risk", part:pt.name, title:sv.solder+" soldered joint"+(sv.solder===1?"":"s")+" on a "+(sv.cls==="field"?"field":"depot")+"-replaceable item",
        why:"The wires are soldered directly to the board on the line. Nothing here is wrong at build — it is the cheapest, lightest joint you can make. "+
            "The cost lands at every removal afterwards: this part cannot be swapped without a soldering iron, so a "+
            (sv.cls==="field"?"flight-line swap becomes a bench job":"bench job becomes a rework job")+".",
        gain:"One service event is "+sv.eventMin+" min. Connectorising these joints costs about "+CUR+fmt(sv.connCost)+
             " and "+r1(sv.connGrams)+" g, and saves "+r2(sv.savedSec/60)+" min per removal — it pays for itself after "+
             sv.breakeven+" removal"+(sv.breakeven===1?"":"s")+
             (sv.removals? ", against "+sv.removals+" expected over life." : ", and no expected removals are recorded yet.")});
    }
    else if(sv.serviceable && sv.destructive){
      out.push({sev:"risk", part:pt.name, title:"Destructive removal on a serviceable item",
        why:"The joint cannot be broken without destroying the part or its fixing, yet the part is expected to come out in service.",
        gain:"Each removal writes off "+CUR+fmt(c.unit)+" on top of "+sv.eventMin+" min of labour."});
    }
    if(sv.serviceable && sv.depth >= 4){
      out.push({sev:"warn", weight:sv.eventSec, part:pt.name, title:"Buried "+sv.depth+" parts deep",
        why:"Reaching it means removing "+sv.depth+" other parts first, twice — once to get in and once to close up.",
        gain:"Access adds "+r2(sv.depth*S.lib.service.accessPartSec*2/60)+" min to every service event on this part."});
    }
    if(pt.fieldAssembly && !pt.toolFree){
      out.push({sev:"risk", part:pt.name, title:"Field-assembled but needs a tool",
        why:"This part is fitted by the operator in the field, yet it is not marked tool-free. Tool-free field assembly is a product-level promise; every exception erodes it and adds to deployment time.",
        gain:"Re-detail as a snap, captive latch or quick-release to remove "+r2(r.totalSec)+" s from deployment."});
    }
    if(pt.fieldAssembly && ["screw","screwHand","lockwire","rivet","weld","adhesive","solder"].indexOf(pt.dfa.fix)>=0){
      out.push({sev:"warn", weight:r.fittingSec*r.qty+1e6, part:pt.name, title:"Field joint uses a "+(S.lib.dfa.fFix[pt.dfa.fix]||{label:pt.dfa.fix}).label.toLowerCase(),
        why:"Permanent or torque-dependent fixings do not belong on a joint the operator makes and breaks in the field.",
        gain:"A quick-release or captive latch would cut "+r2(r.fittingSec)+" s and remove a torque-control step from deployment."});
    }
    /* Did this cost come from the part, or from the template it was created
       with? The model cannot tell you that from the number alone. */
    if(!r.isOp){
      const g = geometryCheck(pt);
      if(g.untouched){
        out.unshift({sev:"risk", part:pt.name, title:"Geometry never entered — this cost is the template default",
          why:"Every geometry field on this part ("+g.keys.join(", ")+") is still exactly as it was created. "+
              "The estimator has returned "+CUR+fmt(c.unit)+" for a part it knows nothing about.",
          gain:"Enter the real volume and bounding box from the CAD mass properties. Until you do, exclude this part "+
               "from anything you quote or compare."});
      }
      if(g.clamped){
        out.unshift({sev:"risk", part:pt.name, title:"Part volume is larger than the stock it is cut from",
          why:"The finished volume is "+fmt0(g.partVol)+" mm³ but the stock block is only "+fmt0(g.stockVol)+
              " mm³. The model has capped the part at the stock size and costed zero material removal, so this part "+
              "shows no machining time at all.",
          gain:"One of the two numbers is wrong — usually a unit slip between mm³ and cm³. Fix it before reading any cost from this part."});
      }
      /* A sub-assembly is priced by what is inside it, so a zero of its own is
         correct, not missing. */
      if(pt.cost.process==="purchased" && num(pt.cost.purchasedPrice)<=0 &&
         !(pt.itemType==="subassembly" && S.parts.some(q=>q.parent===pt.id))){
        out.push({sev:"warn", part:pt.name, title:"Purchased part with no price",
          why:"It is counted in the part count and the assembly time, but contributes nothing to cost, so the product total is understated.",
          gain:"Enter the quoted price, or the last price you paid."});
      }
    }

    /* Quantity on a sub-assembly multiplies only its own fitting time, not the
       items inside it — so "4 of these arms" cannot be said this way, and the
       part count it produces looks plausible while being wrong. Say so. */
    if(pt.itemType==="subassembly" && r.qty>1 && S.parts.some(q=>q.parent===pt.id)){
      out.unshift({sev:"risk", part:pt.name, title:"Quantity "+r.qty+" on a sub-assembly does not multiply what is inside it",
        why:"Quantity here multiplies only this row's own fitting time. The "+descendants(pt.id).length+
            " item(s) beneath it are still counted once each, so the part count, mass and cost are those of a single one.",
        gain:"Either set the quantity on each item inside it, or analyse one of them and multiply the result by "+r.qty+
             " outside the tool. Leave this row at 1."});
    }

    /* A sub-assembly that holds parts weighs what its parts weigh, and that
       mass is already in the roll-up. Only a leaf with no geometry is a gap. */
    if(c.massSource==="unknown" && c.massExtended===0 && !r.isOp &&
       !(pt.itemType==="subassembly" && S.parts.some(q=>q.parent===pt.id))){
      out.push({sev:"neutral", part:pt.name, title:"No mass recorded",
        why:"Purchased and catalogue parts have no geometry to compute mass from, so the product mass roll-up is incomplete until you enter it.",
        gain:"Enter the mass in grams on the part's Identity section."});
    }
    if(r.overHandling){
      out.push({sev:"warn", weight:r.handlingSec*r.qty, part:pt.name, title:"Handling index "+r.handlingIndex+" (target ≤"+T.handling+")",
        why:"Driven by: "+ (r.hUsed.length? r.hUsed.join(", ") : "size and orientation effort") +".",
        gain:"Add a symmetry feature or an obvious keying detail to cut "+r2(r.handlingSec)+" s of handling."});
    }
    if(r.overFitting){
      out.push({sev:"warn", weight:r.fittingSec*r.qty, part:pt.name, title:"Fitting index "+r.fittingIndex+" (target ≤"+T.fitting+")",
        why:"Driven by: "+ (r.fUsed.length? r.fUsed.join(", ") : "insertion direction") +".",
        gain:"Chamfers, self-location or top-down access would remove much of "+r2(r.fittingSec)+" s."});
    }
  });

  // biggest cost contributors
  const sorted = cp.rows.slice().sort((a,b)=>b.c.extended-a.c.extended).slice(0,3);
  sorted.forEach(({pt,c})=>{
    if(cp.partsTotal>0 && c.extended/cp.partsTotal > 0.25){
      out.push({sev:"neutral", part:pt.name, title:"Cost concentration — "+r1(c.extended/cp.partsTotal*100)+"% of part cost",
        why:"A single part carries a quarter or more of the product's part cost, so it is where process and material alternatives pay off most."+
            (c.massExtended? " It is also "+r1(c.massExtended)+" g, "+(cp.massG? r1(c.massExtended/cp.massG*100)+"% of product mass":"")+"." : ""),
        gain:"Re-cost it against another process before optimising anything else."});
    }
  });

  // serviceability at product level
  if(cp.svc.solderJoints > 0){
    const trapped = cp.svc.trapped.length;
    const totalConn = cp.svc.trapped.reduce((a,x)=>a+x.c.service.connCost,0);
    const totalGrams = cp.svc.trapped.reduce((a,x)=>a+x.c.service.connGrams,0);
    const savedLife = cp.svc.trapped.reduce((a,x)=>a+x.c.service.savedSec*x.c.service.removals,0);
    if(trapped > 0){
      out.unshift({sev:"risk", part:"— Product", title:cp.svc.solderJoints+" soldered joints, "+trapped+" of them on serviceable items",
        why:"Wire-to-board soldering is decided once at design and paid for at every repair for the life of the fleet. "+
            "It does not appear in build cost, which is why it survives design reviews.",
        gain:"Connectorising just the joints on serviceable items: about "+CUR+fmt(totalConn)+" and "+r1(totalGrams)+" g added"+
             (num(S.meta.massTargetG)>0? " ("+r1(totalGrams/num(S.meta.massTargetG)*100)+"% of the mass budget)":"")+
             ", against "+r2(savedLife/3600)+" hours of maintenance labour saved over the expected removals."});
    }
  }
  // mass budget
  if(num(S.meta.massTargetG)>0 && cp.massG>0){
    const over = cp.massG - num(S.meta.massTargetG);
    if(over > 0){
      const heavy = cp.rows.filter(x=>!dfaPart(x.pt).essential)
                           .reduce((a,x)=>a+x.c.massExtended,0);
      out.unshift({sev:"risk", part:"— Product", title:"Over mass budget by "+r1(over)+" g",
        why:"Roll-up is "+r1(cp.massG)+" g against a target of "+fmt0(S.meta.massTargetG)+" g"+
            (cp.unknownMass? " — and "+cp.unknownMass+" part(s) have no mass recorded, so the real figure is higher." : "."),
        gain: heavy>0 ? "The parts failing the minimum-part-count tests carry "+r1(heavy)+" g between them — consolidation is the cheapest gram."
                      : "Every part is functionally essential, so the mass has to come out of material or wall thickness, not part count."});
    }
  }
  // field deployment budget
  if(num(S.meta.fieldDeployTargetSec)>0 && d.fieldSec > num(S.meta.fieldDeployTargetSec)){
    out.unshift({sev:"risk", part:"— Product", title:"Field deployment "+r2(d.fieldSec)+" s over the "+num(S.meta.fieldDeployTargetSec)+" s target",
      why:d.fieldParts+" part(s) are fitted in the field"+(d.fieldToolParts? ", "+d.fieldToolParts+" of them needing a tool" : "")+".",
      gain:"Deployment time is a spec, not an internal metric — shave it in the joints the operator actually makes."});
  }
  if(d.designEff < T.designEff && d.nTotal>0){
    out.unshift({sev:"risk", part:"— Product", title:"Design efficiency "+d.designEff+"% (target ≥"+T.designEff+"%)",
      why:d.nRedundant+" of "+d.nTotal+" parts fail the minimum-part-count tests.",
      gain:"The theoretical minimum for this product is "+d.nEss+" parts."});
  }
  const order = {risk:0, warn:1, neutral:2};
  out.sort((a,b)=>(order[a.sev]-order[b.sev]) || (b.weight||0)-(a.weight||0));

  // Everything at "act" level is shown. Reviews are capped, worst first, so a
  // 300-part BOM does not bury the four things that actually matter.
  const CAP = 12;
  const warns = out.filter(x=>x.sev==="warn");
  if(warns.length > CAP){
    const keep = new Set(warns.slice(0, CAP));
    const trimmed = out.filter(x=>x.sev!=="warn" || keep.has(x));
    trimmed.push({sev:"neutral", part:"— Review queue", title:(warns.length-CAP)+" more parts breach a target",
      why:"Only the "+CAP+" costliest in assembly time are listed. Export the results CSV for the full set, or tighten the targets in the Library tab to change what qualifies.",
      gain:"Work the listed ones first — they carry the most seconds."});
    return trimmed;
  }
  return out;
}

              ["options","Options"],["reports","Reports"],["library","Library"],["data","Data"]];

/* ============================================================
   7b. STRUCTURE CHART
   The part list is a tree: sub-assemblies hold parts and operations, and the
   base part sits first. Everything is stored flat with a `parent` id, so the
   tree is derived rather than kept in sync.
   ============================================================ */
const ITEM_TYPES = {part:"Part", subassembly:"Sub-assembly", operation:"Operation"};

/* Depth-first walk in list order. Orphans — a parent that was deleted, or a
   link that would close a loop — are shown at the top level rather than
   silently dropped. */
function treeRows(parts){
  parts = parts || S.parts;
  const byId = new Map(parts.map(p=>[p.id,p]));
  const kids = new Map();
  const roots = [];
  const parentOf = p=>{
    let q = p.parent && byId.get(p.parent);
    // break any cycle: walk up, and if we meet ourselves, treat as a root
    const seen = new Set([p.id]);
    let probe = q;
    while(probe){ if(seen.has(probe.id)) return null; seen.add(probe.id); probe = probe.parent && byId.get(probe.parent); }
    return q || null;
  };
  parts.forEach(p=>{
    const par = parentOf(p);
    if(par){ if(!kids.has(par.id)) kids.set(par.id,[]); kids.get(par.id).push(p); }
    else roots.push(p);
  });
  const out = [];
  const walk = (list, depth)=>{
    list.forEach(p=>{ out.push({pt:p, depth}); walk(kids.get(p.id)||[], depth+1); });
  };
  /* Base part first, as the commercial tools insist on — it is the platform
     the rest of the sequence is written against. */
  roots.sort((a,b)=> (b.dfa && b.dfa.isBase?1:0) - (a.dfa && a.dfa.isBase?1:0));
  walk(roots, 0);
  return out;
}
/* Candidate parents for a given item: sub-assemblies only, minus itself and
   anything already beneath it. */
function parentOptions(pt){
  const out = {"":"— top level —"};
  const banned = new Set([pt.id]);
  let grew = true;
  while(grew){
    grew = false;
    S.parts.forEach(p=>{ if(p.parent && banned.has(p.parent) && !banned.has(p.id)){ banned.add(p.id); grew = true; } });
  }
  S.parts.forEach(p=>{ if(p.itemType==="subassembly" && !banned.has(p.id)) out[p.id] = p.name; });
  return out;
}
function descendants(id){
  const out = [];
  const walk = pid => S.parts.forEach(p=>{ if(p.parent===pid){ out.push(p); walk(p.id); } });
  walk(id);
  return out;
}

/* ============================================================
   7c. CHARTS
   Plain inline SVG — no library, no network, and it prints. Colours come from
   the same tokens as the rest of the page, so both themes work.
   ============================================================ */
const SERIES = ["var(--accent)","var(--ok)","var(--steel)","var(--warn)","var(--risk)"];

/* Bars are one colour unless the caller asks otherwise. Cycling colours across
   rows of the same measure would imply a meaning they do not carry, and on this
   page amber and red already mean "over target". */
function svgBars(title, rows, unit, fmtFn){
  if(!rows.length) return "";
  const f = fmtFn || (v=>fmt(v));
  const max = Math.max(...rows.map(r=>Math.abs(r.v)), 1);
  const bars = rows.map(r=>{
    const w = Math.max(0.5, Math.abs(r.v)/max*100);
    return '<div class="barrow"><span class="barlab">'+h(r.k)+'</span>'+
      '<span class="bartrack"><i style="width:'+w+'%;background:'+(r.c||"var(--accent)")+'"></i></span>'+
      '<span class="barval">'+f(r.v)+(unit||"")+'</span></div>';
  }).join("");
  return '<div class="chart"><div class="chart-t">'+h(title)+'</div>'+bars+'</div>';
}

/* A line chart of one or more series sharing an x axis. Used for cost against
   life volume, which is the whole argument for tooling: the curve, not a
   single number at one quantity. */
function svgLines(title, xs, series, xLabel, yLabel, fmtY){
  if(!xs.length || !series.length) return "";
  const W=560, H=240, L=62, R=14, Tp=14, B=42;
  const pw = W-L-R, ph = H-Tp-B;
  const all = series.reduce((a,s)=>a.concat(s.ys),[]).filter(v=>isFinite(v));
  const yMax = Math.max(...all, 0) * 1.08 || 1;
  const xMin = Math.log10(Math.max(1,xs[0])), xMax = Math.log10(Math.max(10,xs[xs.length-1]));
  const px = v => L + (Math.log10(Math.max(1,v))-xMin)/Math.max(1e-9,(xMax-xMin))*pw;
  const py = v => Tp + ph - (v/yMax)*ph;
  const fy = fmtY || (v=>fmt0(v));

  let grid = "", i;
  for(i=0;i<=4;i++){
    const v = yMax*i/4, y = py(v);
    grid += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--rule)" stroke-width="1"/>'+
            '<text x="'+(L-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" class="ax">'+h(fy(v))+'</text>';
  }
  xs.forEach(x=>{
    grid += '<text x="'+px(x).toFixed(1)+'" y="'+(H-B+16)+'" text-anchor="middle" class="ax">'+h(fmt0(x))+'</text>'+
            '<line x1="'+px(x).toFixed(1)+'" y1="'+(Tp+ph)+'" x2="'+px(x).toFixed(1)+'" y2="'+(Tp+ph+4)+'" stroke="var(--rule-strong)"/>';
  });

  const paths = series.map((s,si)=>{
    const col = s.c || SERIES[si%SERIES.length];
    const d = s.ys.map((y,j)=> (j?"L":"M")+px(xs[j]).toFixed(1)+" "+py(y).toFixed(1)).join(" ");
    const dots = s.ys.map((y,j)=>'<circle cx="'+px(xs[j]).toFixed(1)+'" cy="'+py(y).toFixed(1)+'" r="2.6" fill="'+col+'"/>').join("");
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2"/>'+dots;
  }).join("");

  const legend = series.map((s,si)=>
    '<span class="lg"><i style="background:'+(s.c||SERIES[si%SERIES.length])+'"></i>'+h(s.k)+'</span>').join("");

  return '<div class="chart"><div class="chart-t">'+h(title)+'</div>'+
    '<div class="chart-legend">'+legend+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" class="linechart" role="img" aria-label="'+h(title)+'">'+
      grid+
      '<line x1="'+L+'" y1="'+Tp+'" x2="'+L+'" y2="'+(Tp+ph)+'" stroke="var(--rule-strong)"/>'+
      '<line x1="'+L+'" y1="'+(Tp+ph)+'" x2="'+(W-R)+'" y2="'+(Tp+ph)+'" stroke="var(--rule-strong)"/>'+
      paths+
      '<text x="'+(L+pw/2)+'" y="'+(H-4)+'" text-anchor="middle" class="ax">'+h(xLabel)+'</text>'+
      '<text x="12" y="'+(Tp+ph/2)+'" text-anchor="middle" transform="rotate(-90 12 '+(Tp+ph/2)+')" class="ax">'+h(yLabel)+'</text>'+
    '</svg></div>';
}

function kpiRow(d,c){
  const T = S.lib.dfa.targets;
  const cls = (v,t,inv)=> inv ? (v<=t?"ok":(v<=t*1.4?"warn":"risk")) : (v>=t?"ok":(v>=t*0.7?"warn":"risk"));
  return '<div class="kpis">'+
    kpi("Design efficiency", d.designEff+'<small>%</small>', d.nEss+" of "+d.nTotal+" parts essential", Math.min(100,d.designEff), cls(d.designEff,T.designEff))+
    kpi("Theoretical minimum", d.nEss+'<small> parts</small>', d.nRedundant+" candidate"+(d.nRedundant===1?"":"s")+" for elimination")+
    kpi("Assembly time", d.totalSec+'<small>s</small>', r2(d.totalMin)+" min per product")+
    kpi("Assembly efficiency", d.efficiency+'<small>%</small>', "vs "+num(S.lib.rates.idealAssemblySec)+" s ideal per part", Math.min(100,d.efficiency), cls(d.efficiency,35))+
    kpi("Feeding ratio", d.feedingRatio, "target ≤ "+T.handling, Math.min(100,d.feedingRatio/3*100), cls(d.feedingRatio,T.handling,true))+
    kpi("Fitting ratio", d.fittingRatio, "target ≤ "+T.fitting, Math.min(100,d.fittingRatio/3*100), cls(d.fittingRatio,T.fitting,true))+
    kpi("Product cost", CUR+fmt(c.total), "parts "+CUR+fmt(c.partsTotal)+" + assembly "+CUR+fmt(c.assemblyLabour))+
    massKpi(c)+
    (c.svc.serviceable ? kpi("Lifetime service", CUR+fmt0(c.svc.lifetimeCost),
        c.svc.solderJoints? c.svc.solderJoints+" soldered joints, "+c.svc.trapped.length+" on serviceable items"
                          : c.svc.serviceable+" serviceable items, none soldered shut") : "")+
    (d.fieldParts ? kpi("Field deployment", d.fieldMin+'<small>min</small>',
        d.fieldParts+" part"+(d.fieldParts===1?"":"s")+" fitted in the field"+(d.fieldToolParts? ", "+d.fieldToolParts+" needing a tool":", all tool-free"),
        num(S.meta.fieldDeployTargetSec)>0 ? Math.min(100, d.fieldSec/num(S.meta.fieldDeployTargetSec)*100) : undefined,
        num(S.meta.fieldDeployTargetSec)>0 ? (d.fieldSec<=num(S.meta.fieldDeployTargetSec)?"ok":"risk") : "")
      : kpi("Annual spend", CUR+fmt0(c.total*num(S.meta.annualVolume)), "at "+fmt0(S.meta.annualVolume)+" units/yr"))+
  '</div>';
}
function massKpi(c){
  const target = num(S.meta.massTargetG);
  const miss = c.unknownMass ? c.unknownMass+" part(s) with no mass recorded" : "";
  if(target>0){
    const pct = c.massG/target*100;
    return kpi("Mass", r1(c.massG)+'<small>g</small>',
      "of "+fmt0(target)+" g budget"+(miss?" · "+miss:""),
      Math.min(100,pct), pct<=90?"ok":pct<=100?"warn":"risk");
  }
  return kpi("Mass", r1(c.massG)+'<small>g</small>', miss || "no budget set — add one on Setup");
}
function kpi(k,v,m,pct,cls){
  return '<div class="kpi"><div class="k">'+h(k)+'</div><div class="v">'+v+'</div>'+
    (m?'<div class="m">'+h(m)+'</div>':'')+
    (pct!==undefined?'<div class="meter"><i class="'+(cls||"")+'" style="width:'+Math.max(2,Math.min(100,pct))+'%"></i></div>':'')+
  '</div>';
}
